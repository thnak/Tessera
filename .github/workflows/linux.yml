# SPDX-License-Identifier: MIT

name: Linux

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'decisions/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'decisions/**'
      - '**/*.md'

# A new push to a pull request cancels the run it supersedes; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libvulkan-dev vulkan-tools \
            mesa-vulkan-drivers vulkan-validationlayers \
            glslc glslang-tools libx11-dev xvfb xauth x11-utils libcurl4-openssl-dev
          python3 -m pip install --user "clang-format==$(cat tools/format-version.txt)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select lavapipe ICD
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Format check
        run: bash scripts/format.sh --check

      - uses: ./.github/actions/ccache
        with:
          name: linux

      - name: Configure
        run: cmake --preset ci -DTESSERA_WARNINGS_AS_ERRORS=ON -DTESSERA_ENABLE_THORVG=ON -DTESSERA_NET_LOOPBACK_TESTS=ON

      - name: Build
        run: cmake --build --preset ci

      - name: ccache statistics
        run: ccache --show-stats

      - name: Check static C++ runtime (ADR-012)
        run: |
          if ldd build/ci/tools/poc/vulkan_offscreen/vulkan_offscreen_poc \
              | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "unexpected dynamic C++ runtime; static linking is required"
            exit 1
          fi

      - name: Static-link allowlist (ADR-012, Linux)
        run: |
          python3 -B scripts/check_static_link.py --os linux \
            --binary build/ci/tools/poc/vulkan_offscreen/vulkan_offscreen_poc \
            --binary build/ci/tools/poc/batched2d/batched2d_poc

      - name: Tests (null + lavapipe + validation)
        run: |
          # pipefail, because the `| tee` below would otherwise report tee's exit code and a red
          # suite would look green.
          set -o pipefail
          Xvfb :99 -screen 0 1280x1024x24 -ac &
          sleep 1
          # --output-junit gets an ABSOLUTE path: `ctest --preset` resolves a relative path against
          # the preset's test directory, so `build/ci/x.xml` lands in `build/ci/build/ci/x.xml`.
          # The report feeds the release-suite gate below, which is what turns "the run exited 0"
          # into "the validation and golden suites actually ran".
          junit="$PWD/build/ci/release-junit.xml"
          DISPLAY=:99 ctest --preset ci --output-on-failure \
            --output-junit "$junit" 2>&1 | tee "$RUNNER_TEMP/release-tests.log"

      # Issue #199: a Release build must run the validation layer and the golden suites, and must
      # fail closed when either is silently absent. Both silent-pass shapes are real here - the
      # validation entry only warns when the Khronos layer is missing, and the goldens carry
      # SKIP_REGULAR_EXPRESSION - so the gate reads the JUnit report and the log instead of the
      # exit code alone.
      #
      # This list is the Linux column of the lane/suite matrix. It is spelled out here, not hidden
      # in the script, so a reviewer can see what the lane claims; the `release-gates` job runs
      # `check_release_suites.py --workflows`, which fails when this list and LANE_MATRIX drift
      # apart in either direction. That is what catches a lane quietly dropping a suite.
      #
      # Every suite below can genuinely run on this lane: it installs lavapipe (the ADR-009
      # reference renderer) and the Khronos validation layer in its first steps.
      - name: Release suites really ran (validation layer + goldens)
        run: |
          python3 -B scripts/check_release_suites.py \
            --lane linux \
            --junit "$PWD/build/ci/release-junit.xml" \
            --log "$RUNNER_TEMP/release-tests.log" \
            --require batched2d_vulkan_validation \
            --require batched2d_on_demand \
            --require batched2d_golden \
            --require batched2d_overlay_golden \
            --require batched2d_text_golden \
            --require batched2d_shapes_golden \
            --require batched2d_cpu_golden \
            --require batched2d_cpu_text_golden \
            --require batched2d_cpu_vector_golden \
            --require batched2d_cpu_image_golden \
            --require cpu_wide_golden \
            --require gallery_golden_light_none \
            --require gallery_golden_high_contrast_focus \
            --require gallery_golden_safe_area_fold_dark \
            --require harness_frame_capture \
            --forbid-text "validation layer not available"

      # Release-build outputs, published so a run can be reviewed without a rebuild: the golden
      # frames and diffs the suites rendered, the JUnit report, and the CTest log. The
      # distributable archive is NOT published from here - docs/guides/packaging.md section 5
      # keeps it a release-time artifact, and `static-runtime-proof` already builds and checks it.
      - name: Upload Release build artifacts
        if: always()
        run: |
          set -euo pipefail
          artifacts="$RUNNER_TEMP/release-artifacts"
          mkdir -p "$artifacts"
          # Every PNG a golden wrote (frame, diff, updated baseline candidate) plus the reports.
          find build/ci -type f \( -name '*.png' -o -name '*junit*.xml' -o -name '*report*.json' \) \
            -exec cp --parents {} "$artifacts/" \; 2>/dev/null || true
          cp "$RUNNER_TEMP/release-tests.log" "$artifacts/" 2>/dev/null || true
          echo "collected $(find "$artifacts" -type f | wc -l) file(s)"
          find "$artifacts" -type f | sed -n '1,40p'

      - name: Upload release artifacts (Linux)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Upload gallery golden artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-golden-artifacts
          path: build/ci/samples/gallery/golden-artifacts
          if-no-files-found: ignore
          retention-days: 14

      - name: Vulkan offscreen PoC (lavapipe)
        run: |
          ./build/ci/tools/poc/vulkan_offscreen/vulkan_offscreen_poc \
            --out offscreen.png --no-validation

      - name: Upload offscreen PNG
        uses: actions/upload-artifact@v4
        with:
          name: offscreen-png
          path: offscreen.png
          retention-days: 14

  # ADR-049 decision item 1.3 and docs/specs/shader-manifest-v1.md section 5.1: the opt-in
  # TESSERA_SHADER_CROSS lane is off in every preset, so it would otherwise never run. This job is
  # the only place the portable branch is compiled a second time and its translations are validated.
  # It is target-restricted (the cross targets plus the parity test, not the whole tree) so the lane
  # stays cheap. Configure skips any optional tool it cannot find rather than failing, so a host
  # without one still exercises the rest; `glslc` is the only tool the job installs as mandatory.
  # `dxc` has no Ubuntu package, so the `_hlsl_dxc` tests do not exist on Linux; `spirv-val`,
  # `spirv-cross`, `spirv-opt` and naga do run, and `_wgsl_naga` is the check that catches a
  # translator-incompatible shader.
  #
  # TESSERA_BUILD_VULKAN=OFF (same flags as the `icu-text` job): this lane builds no Vulkan code, so
  # it must not pull in the Vulkan SDK. `ci` defaults the option to ON, and
  # `src/rendering/backend/vulkan/CMakeLists.txt:3` is a hard `find_package(Vulkan REQUIRED)`, which
  # needs the dev headers (`libvulkan-dev`) that `vulkan-validationlayers` does not provide — that
  # is what broke this job's first run. Turning the backend off removes the only Vulkan package
  # search, so the lane needs no graphics SDK at all. `shader_parity_tests` links
  # `tessera_rhi_vulkan` only when that target exists (`tests/gpu/CMakeLists.txt:99`), so it still
  # builds and runs; its Vulkan-only `shader_id` assertion is covered by the Windows and `linux`
  # lanes, which do build the backend.
  shader-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Read naga pin
        run: echo "NAGA_VERSION=$(cat tools/naga-version.txt)" >> "$GITHUB_ENV"

      # python3 is explicit because tests/gpu/CMakeLists.txt:150 requires it at configure time;
      # `ubuntu-latest` happens to preinstall it, and this keeps the job correct if that changes.
      # No Vulkan packages: TESSERA_BUILD_VULKAN=OFF means the lane never links the SDK.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential python3 \
            glslc spirv-tools spirv-cross
          python3 -m pip install --user "clang-format==$(cat tools/format-version.txt)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache naga
        id: naga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-${{ runner.os }}-${{ env.NAGA_VERSION }}

      - name: Install naga-cli
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked
      - name: Put naga on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/ccache
        with:
          name: shader-cross

      # Configure must not fail on a missing optional tool: TesseraShaderCross.cmake warns for
      # glslc only (it is the one mandatory tool) and skips every other tool's outputs. The
      # "Shader cross:" lines in the log are the record of what this run could check.
      #
      # The presence assertions below are the other half of that contract: this job installs
      # spirv-val, spirv-cross, spirv-opt and naga, so a `not found` line means the install broke
      # and the lane would silently test less than it claims. Only `dxc` (no Ubuntu package) is
      # allowed to be missing. `-DTESSERA_BUILD_VULKAN=OFF` keeps the Vulkan SDK out of a lane that
      # builds no Vulkan code; see the job comment.
      - name: Configure (TESSERA_SHADER_CROSS=ON)
        run: |
          set -o pipefail
          cmake --preset ci -DTESSERA_SHADER_CROSS=ON -DTESSERA_BUILD_POC=OFF \
            -DTESSERA_BUILD_VULKAN=OFF -DTESSERA_WARNINGS_AS_ERRORS=ON \
            | tee "$RUNNER_TEMP/configure.log"
          grep -q "Shader cross:" "$RUNNER_TEMP/configure.log"
          for tool in SPIRV_VAL SPIRV_OPT SPIRV_CROSS NAGA; do
            if ! grep -q "^-- Shader cross: $tool = " "$RUNNER_TEMP/configure.log"; then
              echo "expected $tool but configure did not find it:"
              grep "Shader cross:" "$RUNNER_TEMP/configure.log"
              exit 1
            fi
          done
          grep -q "^-- Shader cross: DXC not found" "$RUNNER_TEMP/configure.log" \
            || echo "note: dxc is present, so the HLSL compile tests run too"

      - name: Build cross-compiled shaders and the parity test
        run: |
          cmake --build --preset ci --target \
            tessera_shader_cross_batched2d tessera_shader_cross_glass_blur \
            tessera_shader_cross_storage_probe shader_parity_tests

      - name: Cross-compile artifacts exist
        run: |
          for id in batched2d glass_blur storage_probe; do
            dir="build/ci/shaders/cross/$id"
            for stage in vert frag; do
              test -s "$dir/$id.$stage.portable.spv" || { echo "missing $dir/$id.$stage.portable.spv"; exit 1; }
              test -s "$dir/$id.$stage.metal"        || { echo "missing $dir/$id.$stage.metal"; exit 1; }
              test -s "$dir/$id.$stage.hlsl"         || { echo "missing $dir/$id.$stage.hlsl"; exit 1; }
              test -s "$dir/$id.$stage.wgsl"         || { echo "missing $dir/$id.$stage.wgsl"; exit 1; }
            done
          done
          echo "portable, MSL, HLSL and WGSL artifacts present for all three shaders"

      # shader_parity proves the portable GLSL branch agrees with the authored WGSL interface; it
      # needs no tool and also runs in the default (cross OFF) lanes.
      - name: Shader tests (spirv-val, naga, authored WGSL, parity)
        run: ctest --preset ci -R "shader_cross|shader_parity" --output-on-failure

      - name: ccache statistics
        run: ccache --show-stats

  # docs/design/icu-data.md section 8.6: the ICU engine stays opt-in (TESSERA_ICU_REDUCED_DATA), so
  # exactly one job carries its cost — the pinned host tools, the full data blob, the ON configure
  # and the filtered text suite. Every other lane keeps the builtin segmenter; text_breaks_parity
  # keeps proving both engines produce the same line boxes on the shared corpus.
  icu-text:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential curl
          python3 -m pip install --user "clang-format==$(cat tools/format-version.txt)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Provision pinned ICU host tools and full data
        run: |
          curl -fsSL -o "$RUNNER_TEMP/icu4c-76_1-src.tgz" \
            "https://github.com/unicode-org/icu/releases/download/release-76-1/icu4c-76_1-src.tgz"
          echo "dfacb46bfe4747410472ce3e1144bf28a102feeaa4e3875bac9b4c6cf30f4f3e  $RUNNER_TEMP/icu4c-76_1-src.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/icu"
          tar -xzf "$RUNNER_TEMP/icu4c-76_1-src.tgz" -C "$RUNNER_TEMP/icu" --strip-components=1
          cd "$RUNNER_TEMP/icu/source"
          ./runConfigureICU Linux --disable-samples > configure.log
          make -j"$(nproc)" > make.log
          test -x bin/icupkg
          test -x bin/genccode
          test -f data/in/icudt76l.dat
          # The tools are built but not installed, so they link the shared ICU libraries out of
          # this build tree; later steps (including the reduced-data step inside the Tessera build)
          # need that directory on the loader path. lib64 covers platforms whose configure picks
          # it. Exported through GITHUB_ENV because the `runner` context is not available in
          # job-level `env` (using it there makes the workflow file invalid).
          export LD_LIBRARY_PATH="$RUNNER_TEMP/icu/source/lib:$RUNNER_TEMP/icu/source/lib64"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          bin/icupkg --help > /dev/null

      - uses: ./.github/actions/ccache
        with:
          name: icu-text

      - name: Configure (ICU reduced static data ON)
        run: |
          cmake --preset ci -DTESSERA_WARNINGS_AS_ERRORS=ON -DTESSERA_ENABLE_THORVG=ON \
            -DTESSERA_ICU_REDUCED_DATA=ON \
            -DTESSERA_ICU_TOOLS_DIR="$RUNNER_TEMP/icu/source/bin" \
            -DTESSERA_ICU_FULL_DATA="$RUNNER_TEMP/icu/source/data/in/icudt76l.dat" \
            -DTESSERA_ICU_SOURCE_DIR="$RUNNER_TEMP/icu" \
            -DTESSERA_BUILD_VULKAN=OFF -DTESSERA_BUILD_POC=OFF

      - name: Build
        run: cmake --build --preset ci

      - name: ccache statistics
        run: ccache --show-stats

      - name: Filtered text suite on the ICU engine
        run: ctest --preset ci -R "text_|paint_text|paint_text_wrap|layout_|icu" --output-on-failure

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # depth 2 keeps the parent commit, which the RHI-header docs gate diffs against on a
      # committed CI change (scripts/check_docs.py, ADR-049).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install pinned clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/format-venv"
          "$RUNNER_TEMP/format-venv/bin/pip" install "clang-format==$(cat tools/format-version.txt)"
          echo "CLANG_FORMAT=$RUNNER_TEMP/format-venv/bin/clang-format" >> "$GITHUB_ENV"

      - name: Gate self-tests (fixtures)
        run: python3 -B -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Repository gates (aggregator)
        run: python3 -B scripts/gates.py

      # Issue #199: the lane/suite matrix is enforced statically here, on every push, so a release
      # lane that silently stops declaring a golden or validation suite fails fast instead of
      # waiting for a runtime report that would simply omit it. `scripts/check_release_suites.py`
      # owns LANE_MATRIX; the build jobs own the `--require`/`--allow-skip` lists they pass at
      # runtime, and the two are checked against each other.
      - name: Release suite matrix (workflows declare their suites)
        run: python3 -B scripts/check_release_suites.py --workflows

  release-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_DATE_EPOCH: "315532800"
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - name: Clean-room release rehearsal (HEAD)
        run: python3 -B scripts/release_rehearsal.py --target static_runtime_probe

  static-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Release static-runtime proof (ADR-012)
        run: python3 -B scripts/check_static_runtime.py --config Release --target static_runtime_probe

      - name: Reproducible build and package proof (ADR-009)
        run: |
          python3 -B scripts/check_reproducible.py \
            --config Release --target static_runtime_probe --build-root build/repro --package

      - name: Package the Release artifact (CPack)
        env:
          SOURCE_DATE_EPOCH: "315532800"
          TZ: UTC
        run: |
          cmake -S . -B build/package \
            -DCMAKE_BUILD_TYPE=Release -DTESSERA_STATIC_RUNTIME=ON \
            -DTESSERA_BUILD_VULKAN=OFF -DTESSERA_BUILD_POC=OFF \
            -DTESSERA_BUILD_TESTS=ON -DTESSERA_USE_COMPILER_CACHE=OFF \
            -DTESSERA_PACKAGE_EXECUTABLES=static_runtime_probe
          cmake --build build/package --config Release --target tessera-package-stage --parallel
          cpack --config build/package/CPackConfig.cmake -G TGZ -B build/package/out

      - name: Package content gate
        run: |
          python3 -B scripts/check_package.py \
            --archive "$(ls build/package/out/tessera-*.tar.gz | head -n1)"
