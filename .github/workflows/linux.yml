# SPDX-License-Identifier: MIT

name: Linux

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'decisions/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'decisions/**'
      - '**/*.md'

# A new push to a pull request cancels the run it supersedes; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libvulkan-dev vulkan-tools \
            mesa-vulkan-drivers vulkan-validationlayers \
            glslc glslang-tools libx11-dev xvfb xauth x11-utils
          python3 -m pip install --user "clang-format==$(cat tools/format-version.txt)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select lavapipe ICD
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Format check
        run: bash scripts/format.sh --check

      - uses: ./.github/actions/ccache
        with:
          name: linux

      - name: Configure
        run: cmake --preset ci -DTESSERA_WARNINGS_AS_ERRORS=ON -DTESSERA_ENABLE_THORVG=ON

      - name: Build
        run: cmake --build --preset ci

      - name: ccache statistics
        run: ccache --show-stats

      - name: Check static C++ runtime (ADR-012)
        run: |
          if ldd build/ci/tools/poc/vulkan_offscreen/vulkan_offscreen_poc \
              | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "unexpected dynamic C++ runtime; static linking is required"
            exit 1
          fi

      - name: Static-link allowlist (ADR-012, Linux)
        run: |
          python3 -B scripts/check_static_link.py --os linux \
            --binary build/ci/tools/poc/vulkan_offscreen/vulkan_offscreen_poc \
            --binary build/ci/tools/poc/batched2d/batched2d_poc

      - name: Tests (null + lavapipe + validation)
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -ac &
          sleep 1
          DISPLAY=:99 ctest --preset ci --output-on-failure

      - name: Vulkan offscreen PoC (lavapipe)
        run: |
          ./build/ci/tools/poc/vulkan_offscreen/vulkan_offscreen_poc \
            --out offscreen.png --no-validation

      - name: Upload offscreen PNG
        uses: actions/upload-artifact@v4
        with:
          name: offscreen-png
          path: offscreen.png
          retention-days: 14

  # docs/design/icu-data.md section 8.6: the ICU engine stays opt-in (TESSERA_ICU_REDUCED_DATA), so
  # exactly one job carries its cost — the pinned host tools, the full data blob, the ON configure
  # and the filtered text suite. Every other lane keeps the builtin segmenter; text_breaks_parity
  # keeps proving both engines produce the same line boxes on the shared corpus.
  icu-text:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential curl
          python3 -m pip install --user "clang-format==$(cat tools/format-version.txt)"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Provision pinned ICU host tools and full data
        run: |
          curl -fsSL -o "$RUNNER_TEMP/icu4c-76_1-src.tgz" \
            "https://github.com/unicode-org/icu/releases/download/release-76-1/icu4c-76_1-src.tgz"
          echo "dfacb46bfe4747410472ce3e1144bf28a102feeaa4e3875bac9b4c6cf30f4f3e  $RUNNER_TEMP/icu4c-76_1-src.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/icu"
          tar -xzf "$RUNNER_TEMP/icu4c-76_1-src.tgz" -C "$RUNNER_TEMP/icu" --strip-components=1
          cd "$RUNNER_TEMP/icu/source"
          ./runConfigureICU Linux --disable-samples > configure.log
          make -j"$(nproc)" > make.log
          test -x bin/icupkg
          test -x bin/genccode
          test -f data/in/icudt76l.dat
          # The tools are built but not installed, so they link the shared ICU libraries out of
          # this build tree; later steps (including the reduced-data step inside the Tessera build)
          # need that directory on the loader path. lib64 covers platforms whose configure picks
          # it. Exported through GITHUB_ENV because the `runner` context is not available in
          # job-level `env` (using it there makes the workflow file invalid).
          export LD_LIBRARY_PATH="$RUNNER_TEMP/icu/source/lib:$RUNNER_TEMP/icu/source/lib64"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          bin/icupkg --help > /dev/null

      - uses: ./.github/actions/ccache
        with:
          name: icu-text

      - name: Configure (ICU reduced static data ON)
        run: |
          cmake --preset ci -DTESSERA_WARNINGS_AS_ERRORS=ON -DTESSERA_ENABLE_THORVG=ON \
            -DTESSERA_ICU_REDUCED_DATA=ON \
            -DTESSERA_ICU_TOOLS_DIR="$RUNNER_TEMP/icu/source/bin" \
            -DTESSERA_ICU_FULL_DATA="$RUNNER_TEMP/icu/source/data/in/icudt76l.dat" \
            -DTESSERA_ICU_SOURCE_DIR="$RUNNER_TEMP/icu" \
            -DTESSERA_BUILD_VULKAN=OFF -DTESSERA_BUILD_POC=OFF

      - name: Build
        run: cmake --build --preset ci

      - name: ccache statistics
        run: ccache --show-stats

      - name: Filtered text suite on the ICU engine
        run: ctest --preset ci -R "text_|paint_text|paint_text_wrap|layout_|icu" --output-on-failure

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # depth 2 keeps the parent commit, which the RHI-header docs gate diffs against on a
      # committed CI change (scripts/check_docs.py, ADR-049).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install pinned clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/format-venv"
          "$RUNNER_TEMP/format-venv/bin/pip" install "clang-format==$(cat tools/format-version.txt)"
          echo "CLANG_FORMAT=$RUNNER_TEMP/format-venv/bin/clang-format" >> "$GITHUB_ENV"

      - name: Gate self-tests (fixtures)
        run: python3 -B -m unittest discover -s scripts/tests -p "test_*.py" -v

      - name: Repository gates (aggregator)
        run: python3 -B scripts/gates.py

  release-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_DATE_EPOCH: "315532800"
      TZ: UTC

    steps:
      - uses: actions/checkout@v4

      - name: Clean-room release rehearsal (HEAD)
        run: python3 -B scripts/release_rehearsal.py --target merger_tests

  static-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Release static-runtime proof (ADR-012)
        run: python3 -B scripts/check_static_runtime.py --config Release --target merger_tests

      - name: Reproducible build and package proof (ADR-009)
        run: |
          python3 -B scripts/check_reproducible.py \
            --config Release --target merger_tests --build-root build/repro --package

      - name: Package the Release artifact (CPack)
        env:
          SOURCE_DATE_EPOCH: "315532800"
          TZ: UTC
        run: |
          cmake -S . -B build/package \
            -DCMAKE_BUILD_TYPE=Release -DTESSERA_STATIC_RUNTIME=ON \
            -DTESSERA_BUILD_VULKAN=OFF -DTESSERA_BUILD_POC=OFF \
            -DTESSERA_BUILD_TESTS=ON -DTESSERA_USE_COMPILER_CACHE=OFF \
            -DTESSERA_PACKAGE_EXECUTABLES=merger_tests
          cmake --build build/package --config Release --target tessera-package-stage --parallel
          cpack --config build/package/CPackConfig.cmake -G TGZ -B build/package/out

      - name: Package content gate
        run: |
          python3 -B scripts/check_package.py \
            --archive "$(ls build/package/out/tessera-*.tar.gz | head -n1)"
