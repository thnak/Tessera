# SPDX-License-Identifier: MIT

name: Windows

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'decisions/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'decisions/**'
      - '**/*.md'

# A new push to a pull request cancels the run it supersedes; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    # The gated suite (build + package + install layout + static-link/static-runtime proofs + the
    # full ctest) now needs roughly 30 minutes on a hosted runner and the 30-minute cap started
    # cancelling runs mid-Tests (#258, 2026-11-13: cancelled at 30m06s; #252 passed at 29m57s). 50
    # minutes leaves headroom for a slow runner without hiding a hung job.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      # Ninja, not the Visual Studio generator: VS generators ignore compiler launchers, so ccache
      # can only work here with Ninja plus the MSVC environment.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: ./.github/actions/ccache
        with:
          name: windows

      - name: Configure (MSVC, Ninja, null backend)
        run: >
          cmake --preset ci
          -DTESSERA_BUILD_VULKAN=OFF
          -DTESSERA_BUILD_POC=OFF
          -DTESSERA_PACKAGE_EXECUTABLES=static_runtime_probe
          -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ci

      - name: ccache statistics
        run: ccache --show-stats

      - name: Package build (CPack ZIP)
        env:
          SOURCE_DATE_EPOCH: "315532800"
          TZ: UTC
        run: |
          cmake --build --preset ci --target tessera-package-stage
          cpack --config build/ci/CPackConfig.cmake -G ZIP -B build/ci/package

      - name: Package gate (check_package.py)
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/ci/package/tessera-*.zip | Select-Object -First 1
          if (-not $archive) { throw 'no package archive found' }
          python -B scripts/check_package.py --archive $archive.FullName

      - name: Install layout (cmake --install)
        shell: pwsh
        run: |
          cmake --install build/ci --prefix build/ci/install-check --component licenses
          foreach ($name in @('LICENSE', 'THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_LICENSES.txt', 'sbom.spdx.json')) {
            $path = Join-Path 'build/ci/install-check/share/tessera/licenses' $name
            if (-not (Test-Path $path)) { throw "missing installed file: $path" }
          }

      - name: Static-link allowlist (ADR-012, Windows)
        run: >
          python -B scripts/check_static_link.py --os windows
          --binary build/ci/tests/unit/static_runtime_probe.exe

      - name: Release static-runtime proof (ADR-012)
        run: python -B scripts/check_static_runtime.py --config Release --target static_runtime_probe

      - name: Tests
        shell: pwsh
        run: |
          # The log is tee'd for the gate below, so ctest's exit code is captured explicitly
          # instead of being inferred from the pipeline. --output-junit gets an ABSOLUTE path:
          # `ctest --preset` resolves a relative one against the preset's test directory, so
          # `build/ci/x.xml` would land in `build/ci/build/ci/x.xml`.
          $log = "$env:RUNNER_TEMP\release-tests.log"
          $junit = Join-Path $PWD 'build/ci/release-junit.xml'
          ctest --preset ci --output-on-failure --output-junit $junit 2>&1 |
            Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      # Issue #199 on the Windows lane. This lane configures with -DTESSERA_BUILD_VULKAN=OFF, so it
      # has no Vulkan device and therefore cannot run the lavapipe goldens (their ctest entries are
      # registered only under 'if (UNIX AND TARGET batched2d_poc)' in tests/gpu/CMakeLists.txt) or
      # the validation layer (there is no Vulkan instance here at all). What it CAN and MUST run is
      # the GPU-free golden corpus, which is bit-exact across platforms by construction and is
      # exactly the cross-platform half of the golden suite.
      #
      # The Windows column of the lane/suite matrix lives in the gate's LANE_MATRIX, keyed by
      # `--lane`: every suite this lane cannot run is declared there with its reason, so the gap is
      # stated rather than hidden. Passing the lists here as well would be the duplication the
      # gate exists to prevent, and `--workflows` already checks the YAML against the matrix.
      #
      # Two goldens are deliberately NOT turned on for this lane:
      #   * batched2d_cpu_vector_golden needs TESSERA_ENABLE_THORVG=ON, which FetchContent-downloads
      #     and compiles ThorVG (37 sources) in a job whose 50-minute cap is already documented as
      #     tight (#258): a new network fetch and a build-cost increase, so an owner decision
      #     rather than a silent change here. The Linux lane runs it.
      #   * batched2d_cpu_golden / batched2d_cpu_text_golden need batched2d_poc, which this lane
      #     turns off and which links tessera_rhi_vulkan unconditionally. Linux runs both.
      - name: Release suites really ran (GPU-free goldens)
        shell: pwsh
        run: |
          $junit = Join-Path $PWD 'build/ci/release-junit.xml'
          python -B scripts/check_release_suites.py `
            --lane windows `
            --junit $junit `
            --log "$env:RUNNER_TEMP\release-tests.log"

      # Release-build outputs, published so a run can be reviewed without a rebuild: every golden
      # frame and diff the CPU corpus rendered, plus the JUnit report and the CTest log. The
      # distributable ZIP is still built and checked above, and is not uploaded as an artifact here
      # (docs/guides/packaging.md section 5 keeps the archive a release-time artifact).
      - name: Upload Release build artifacts (Windows)
        if: always()
        shell: pwsh
        run: |
          $artifacts = Join-Path $env:RUNNER_TEMP 'release-artifacts'
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $root = (Resolve-Path 'build/ci').Path
          Get-ChildItem -Path build/ci -Recurse -File -Include *.png,*.xml,*.json |
            ForEach-Object {
              $relative = $_.FullName.Substring($root.Length).TrimStart('\', '/')
              $target = Join-Path $artifacts $relative
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              Copy-Item $_.FullName $target
            }
          if (Test-Path "$env:RUNNER_TEMP\release-tests.log") {
            Copy-Item "$env:RUNNER_TEMP\release-tests.log" $artifacts
          }
          Write-Host "collected $((Get-ChildItem $artifacts -Recurse -File).Count) file(s)"

      - name: Upload release artifacts (Windows)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-windows
          path: ${{ runner.temp }}/release-artifacts
          if-no-files-found: warn
          retention-days: 30

  release-gates:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      # depth 2 keeps the parent commit, which the RHI-header docs gate diffs against on a
      # committed CI change (scripts/check_docs.py, ADR-049).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install pinned clang-format
        shell: pwsh
        run: |
          $version = (Get-Content tools/format-version.txt -Raw).Trim()
          python -m venv "$env:RUNNER_TEMP\format-venv"
          & "$env:RUNNER_TEMP\format-venv\Scripts\pip.exe" install "clang-format==$version"
          "CLANG_FORMAT=$env:RUNNER_TEMP\format-venv\Scripts\clang-format.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Repository gates (aggregator)
        run: python -B scripts/gates.py

      # Issue #199: the lane/suite matrix is enforced statically here too, so the check runs on both
      # release-relevant hosts. It reads the workflow YAML as text, so it needs no YAML library and
      # no checkout of another job's output.
      - name: Release suite matrix (workflows declare their suites)
        run: python -B scripts/check_release_suites.py --workflows
