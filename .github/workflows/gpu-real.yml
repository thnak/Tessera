# SPDX-License-Identifier: MIT

# Real-GPU lane: runs the window and Vulkan tests that hosted CI skips (no display, no GPU) on a
# self-hosted runner with a real GPU. Manual only. This repository is public, so this workflow must
# never run on `pull_request` or `push`: a self-hosted runner would execute code from any fork.
# Setup and the security rules: docs/guides/real-gpu-ci.md.

name: Real GPU

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of this repository to test
        required: false
        default: main
      filter:
        description: ctest regex of the tests to run
        required: false
        default: app_window|vulkan_|caret_blink|app_input|gpu
      repeat:
        description: Run each test up to N times, stopping at the first failure (flake hunting)
        required: false
        default: '3'
      fail_on_skip:
        description: Fail when a test skips because the runner has no display or driver
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: real-gpu
  cancel-in-progress: false

jobs:
  gpu-windows:
    # The labels are registered on the runner by the owner; a runner without `tessera-gpu` never
    # picks this job up.
    runs-on: [self-hosted, windows, x64, tessera-gpu]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build and run the GPU tests
        shell: pwsh
        env:
          TESSERA_GPU_FAIL_ON_SKIP: ${{ inputs.fail_on_skip && '1' || '0' }}
          # Inputs go through the environment, never into the script text (no expression injection).
          GPU_FILTER: ${{ inputs.filter }}
          GPU_REPEAT: ${{ inputs.repeat }}
        run: ./scripts/gpu_tests.ps1 -Filter $env:GPU_FILTER -Repeat ([int]$env:GPU_REPEAT)

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-log
          path: build/gpu-real/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14
