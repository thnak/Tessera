# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libvulkan-dev vulkan-tools \
            mesa-vulkan-drivers glslc glslang-tools clang-format

      - name: Format check
        run: bash scripts/format.sh --check

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Check static C++ runtime (ADR-012)
        run: |
          if ldd build/ci/tools/poc/vulkan_offscreen/vulkan_offscreen_poc \
              | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "unexpected dynamic C++ runtime; static linking is required"
            exit 1
          fi

      - name: Unit tests
        run: ctest --preset ci

      - name: Vulkan offscreen PoC (lavapipe)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: |
          ./build/ci/tools/poc/vulkan_offscreen/vulkan_offscreen_poc \
            --out offscreen.png --no-validation

      - name: Upload offscreen PNG
        uses: actions/upload-artifact@v4
        with:
          name: offscreen-png
          path: offscreen.png
          retention-days: 14
