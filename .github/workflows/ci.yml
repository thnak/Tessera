# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libvulkan-dev vulkan-tools \
            mesa-vulkan-drivers vulkan-validationlayers \
            glslc glslang-tools
          python3 -m pip install --user clang-format==22.1.3
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select lavapipe ICD
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Format check
        run: bash scripts/format.sh --check

      - name: Configure
        run: cmake --preset ci -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ci

      - name: Check static C++ runtime (ADR-012)
        run: |
          if ldd build/ci/tools/poc/vulkan_offscreen/vulkan_offscreen_poc \
              | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "unexpected dynamic C++ runtime; static linking is required"
            exit 1
          fi

      - name: Tests (null + lavapipe + validation)
        run: ctest --preset ci --output-on-failure

      - name: Vulkan offscreen PoC (lavapipe)
        run: |
          ./build/ci/tools/poc/vulkan_offscreen/vulkan_offscreen_poc \
            --out offscreen.png --no-validation

      - name: Upload offscreen PNG
        uses: actions/upload-artifact@v4
        with:
          name: offscreen-png
          path: offscreen.png
          retention-days: 14

  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC, null backend)
        run: >
          cmake --preset vs2026
          -DTESSERA_BUILD_VULKAN=OFF
          -DTESSERA_BUILD_POC=OFF
          -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset vs2026-release

      - name: Tests
        run: ctest --preset vs2026-release --output-on-failure

  macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configure (AppleClang, null backend)
        run: >
          cmake -S . -B build/macos
          -DCMAKE_BUILD_TYPE=Release
          -DTESSERA_BUILD_VULKAN=OFF
          -DTESSERA_BUILD_POC=OFF
          -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/macos --parallel

      - name: Tests
        run: ctest --test-dir build/macos --output-on-failure
