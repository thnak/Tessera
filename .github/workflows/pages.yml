# SPDX-License-Identifier: MIT

# The preview page (issue #165, P1 of docs/design/reference-equantic-ui.md section 7.4; studio slice
# D-S5 in docs/specs/designer-studio-v1.md section 12).
#
# Two jobs with different risk:
#
#   build    Assembles the page: the static files in designer/web/ plus the Emscripten diagnostics
#            module built from this commit. It ALWAYS runs on main and on a pull request, and it is a
#            real check - it proves the page and the Wasm module assemble together and that the
#            diagnostics gate passes against the native CLI.
#
#   deploy   Publishes the artifact to GitHub Pages at https://thnak.github.io/Tessera/. It is
#            GUARDED, so a repository where Pages is off (a fork, or this repo before 2026-11-15)
#            skips instead of going red.
#
# Why the deploy stays guarded:
#   GitHub Pages is a repository *setting*, not something a workflow file can turn on. If `deploy`
#   ran unguarded, `actions/deploy-pages` would fail on every push to a repository without it and
#   make main red for a reason no code change caused. Pages is enabled here (Settings -> Pages ->
#   Source: "GitHub Actions"), and the deploy of #165 was the proof that the guard's success path
#   works; the guard is kept for forks and for a repo where the setting is later turned off.
#
#     - Pages enabled: the `pages` API exists, the guard's probe succeeds, and the job deploys;
#     - Pages absent (404) or the probe failing: the job skips with a notice naming which it was;
#     - a PR never deploys (deployment is main-only, ADR-045 decision 1).
#
#   The probe is a `gh api` call, so it needs no secret beyond the workflow token, and it treats any
#   non-200 as "not enabled" rather than as an error.

name: Pages

on:
  push:
    branches: [main]
    paths:
      # `designer/web/**` covers the whole front end, toolchain included: package.json, the committed
      # package-lock.json, vite.config.ts, vite.ssr.config.ts, tsconfig.json and the React sources
      # (issue #422). The lockfile is load-bearing -- `npm ci` refuses a stale one -- so a change to it
      # must run this lane.
      - 'designer/web/**'
      - 'samples/**'
      - 'tools/codegen/**'
      - 'src/compiler/**'
      - 'scripts/ci/wasm_diagnostics_parity.py'
      - 'scripts/ci/preview_budget_probe.mjs'
      - 'scripts/ci/preview_problems.mjs'
      - 'scripts/ci/preview_search_client.mjs'
      - 'scripts/ci/preview_analysis_wiring.mjs'
      - 'scripts/ci/preview_project_problems.mjs'
      - 'scripts/ci/preview_compile_service.mjs'
      - 'scripts/ci/preview_studio_smoke.mjs'
      - 'scripts/ci/preview_live_edit_wiring.mjs'
      - 'scripts/ci/preview_page_checks.mjs'
      - 'scripts/ci/preview_sample_projects.mjs'
      - 'scripts/ci/preview_canvas_pane_states.mjs'
      - 'scripts/ci/preview_canvas_zoom.mjs'
      - 'scripts/ci/preview_canvas_text.mjs'
      - 'scripts/ci/preview_canvas_resize.mjs'
      - 'scripts/ci/preview_viewport_limits.mjs'
      - 'scripts/ci/preview_fold_overlay.mjs'
      - 'scripts/ci/preview_resource_controls.mjs'
      - 'packages/tessera-ui/**'
      - 'scripts/ci/preview_skins.mjs'
      - 'scripts/ci/workbench_layout.mjs'
      - 'scripts/ci/workbench_dock_core.mjs'
      - 'tests/fixtures/studio-layout/**'
      - 'scripts/ci/preview_project_load.mjs'
      - 'scripts/ci/preview_project_folder_ops.mjs'
      - 'scripts/ci/preview_generated_staleness.mjs'
      - 'scripts/ci/preview_recent_projects.mjs'
      - 'scripts/ci/preview_snapshots.mjs'
      - 'scripts/ci/preview_project_package.mjs'
      - 'scripts/ci/preview_mock_host.mjs'
      - 'scripts/ci/preview_mock_sandbox.mjs'
      - 'scripts/ci/mock_test_support.mjs'
      - 'scripts/ci/preview_studio_services.mjs'
      - 'scripts/ci/preview_format_service.mjs'
      - 'scripts/ci/preview_search_service.mjs'
      - 'scripts/ci/preview_analysis_service.mjs'
      - 'designer/web/services/**'
      - 'scripts/ci/preview_theme_handover.mjs'
      - 'scripts/ci/preview_override_client.mjs'
      - 'scripts/ci/preview_workbench*.mjs'
      - 'scripts/check_preview_budget.py'
      - 'scripts/preview_budget_measure.py'
      - 'scripts/preview_budget_ratchet.py'
      - 'tests/golden/perf/preview_budget.json'
      - 'scripts/ci/scene_snapshot_parity.py'
      - 'scripts/ci/scene_frame_parity.py'
      - 'scripts/ci/scene_frame_canvas_probe.mjs'
      - 'scripts/ci/browser_gpu.mjs'
      - 'scripts/ci/preview_browser_canvas_handover.mjs'
      - 'scripts/ci/preview_browser_canvas_size.mjs'
      - 'scripts/ci/preview_browser_fold_overlay.mjs'
      - 'scripts/ci/package.json'
      - 'scripts/ci/package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      # The front end and its toolchain (issue #422): see the push trigger's note.
      - 'designer/web/**'
      - 'samples/**'
      - 'tools/codegen/**'
      - 'src/compiler/**'
      - 'scripts/ci/wasm_diagnostics_parity.py'
      - 'scripts/ci/preview_budget_probe.mjs'
      - 'scripts/ci/preview_problems.mjs'
      - 'scripts/ci/preview_search_client.mjs'
      - 'scripts/ci/preview_analysis_wiring.mjs'
      - 'scripts/ci/preview_project_problems.mjs'
      - 'scripts/ci/preview_compile_service.mjs'
      - 'scripts/ci/preview_studio_smoke.mjs'
      - 'scripts/ci/preview_live_edit_wiring.mjs'
      - 'scripts/ci/preview_page_checks.mjs'
      - 'scripts/ci/preview_sample_projects.mjs'
      - 'scripts/ci/preview_canvas_pane_states.mjs'
      - 'scripts/ci/preview_canvas_zoom.mjs'
      - 'scripts/ci/preview_canvas_text.mjs'
      - 'scripts/ci/preview_canvas_resize.mjs'
      - 'scripts/ci/preview_viewport_limits.mjs'
      - 'scripts/ci/preview_fold_overlay.mjs'
      - 'scripts/ci/preview_resource_controls.mjs'
      - 'packages/tessera-ui/**'
      - 'scripts/ci/preview_skins.mjs'
      - 'scripts/ci/workbench_layout.mjs'
      - 'scripts/ci/workbench_dock_core.mjs'
      - 'tests/fixtures/studio-layout/**'
      - 'scripts/ci/preview_project_load.mjs'
      - 'scripts/ci/preview_project_folder_ops.mjs'
      - 'scripts/ci/preview_generated_staleness.mjs'
      - 'scripts/ci/preview_recent_projects.mjs'
      - 'scripts/ci/preview_snapshots.mjs'
      - 'scripts/ci/preview_project_package.mjs'
      - 'scripts/ci/preview_mock_host.mjs'
      - 'scripts/ci/preview_mock_sandbox.mjs'
      - 'scripts/ci/mock_test_support.mjs'
      - 'scripts/ci/preview_studio_services.mjs'
      - 'scripts/ci/preview_format_service.mjs'
      - 'scripts/ci/preview_search_service.mjs'
      - 'scripts/ci/preview_analysis_service.mjs'
      - 'designer/web/services/**'
      - 'scripts/ci/preview_theme_handover.mjs'
      - 'scripts/ci/preview_override_client.mjs'
      - 'scripts/ci/preview_workbench*.mjs'
      - 'scripts/check_preview_budget.py'
      - 'scripts/preview_budget_measure.py'
      - 'scripts/preview_budget_ratchet.py'
      - 'tests/golden/perf/preview_budget.json'
      - 'scripts/ci/scene_snapshot_parity.py'
      - 'scripts/ci/scene_frame_parity.py'
      - 'scripts/ci/scene_frame_canvas_probe.mjs'
      - 'scripts/ci/browser_gpu.mjs'
      - 'scripts/ci/preview_browser_canvas_handover.mjs'
      - 'scripts/ci/preview_browser_canvas_size.mjs'
      - 'scripts/ci/preview_browser_fold_overlay.mjs'
      - 'scripts/ci/package.json'
      - 'scripts/ci/package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes; runs on main are never cancelled (a
# cancelled deploy would leave the site half-published).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 30 -> 40 when the canvas device-handover gate landed (issue #375): it installs a headless Chromium
    # (~130 MB, cached by Playwright's own store) and drives three browser contexts. The margin is for a
    # cold browser download on a slow runner, not for the gate itself, which runs in well under a minute.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # The studio front end is a Vite + React 19 + TypeScript project since issue #422 (ADR-054), so
      # this lane now builds it. Node is design-time tooling only; it is never a dependency of the app
      # binary or of the Wasm engine, and nothing it produces is linked into either.
      #
      # The version is pinned because the build must be reproducible from the committed lockfile: `npm ci`
      # fails outright if `package.json` and `package-lock.json` disagree, which is the check that keeps
      # the committed lock honest.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: designer/web/package-lock.json

      # `npm ci`, never `npm install`: it installs exactly the lockfile and refuses a stale one.
      - name: Install studio front-end dependencies
        run: npm ci --prefix designer/web

      # `npm run build` = `tsc --noEmit` + `vite build` (the site into dist/) + `vite build` with
      # `vite.ssr.config.ts` (the gate-only bundle in dist-ssr/). The typecheck is part of the build on
      # purpose: a type error is a build failure here rather than a runtime surprise in a browser no CI
      # lane can drive.
      #
      # This runs before the Wasm build on purpose: it is the cheapest step in the job and the one most
      # likely to fail, so a broken front end fails in a minute instead of after an emsdk download.
      - name: Build studio front end (tsc + Vite)
        run: npm run build --prefix designer/web

      - name: Read emsdk pin
        run: echo "EMSDK_VERSION=$(cat tools/emsdk-version.txt)" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # Same emsdk cache key as the WebGPU lane, so the two workflows share the download instead of
      # fetching the SDK twice.
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" \
            https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"

      - name: Activate emsdk
        run: |
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"

      - name: Configure (wasm-webgpu)
        run: |
          emcc --version | head -n1
          cmake --preset wasm-webgpu

      # The same target the parity gate drives, built once here and shipped as the page's module.
      - name: Build browser diagnostics module
        run: cmake --build build/wasm-webgpu --target tessera_diagnostics_wasm --parallel

      # The format worker's module (#577, ADR-061 slice 2): the minimal edit list for Format Document.
      - name: Build browser format module
        run: cmake --build build/wasm-webgpu --target tessera_format_wasm --parallel

      # The analysis worker's module (#568, ADR-060): project-wide diagnostics and the symbol index.
      - name: Build browser analysis module
        run: cmake --build build/wasm-webgpu --target tessera_analysis_wasm --parallel

      # P2 (issue #166): the scene-preview module behind the merged page's Scene view. Same configure
      # and the same pattern; issue #392 merged the pages without merging the modules.
      - name: Build browser scene-preview module
        run: cmake --build build/wasm-webgpu --target tessera_scene_preview_wasm --parallel

      # P3 (issue #167): the canvas module behind the merged page's Canvas view. It links
      # tessera_webgpu, so the same `wasm-webgpu` configure brings the WebGPU backend and the
      # emdawnwebgpu port, and the wasm build proves the module compiles and links against them before
      # anything is published.
      - name: Build browser canvas module
        run: cmake --build build/wasm-webgpu --target tessera_canvas_wasm --parallel

      # The page must not ship a module that does not load, and it must not ship one that disagrees
      # with the native compiler. This is the same gate the WebGPU lane runs, over the same corpus;
      # it needs a native CLI, so a minimal native configure comes along (compiler only).
      - name: Configure (native, compiler only)
        run: >
          cmake -S . -B build/native-pages -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTESSERA_BUILD_TESTS=OFF
          -DTESSERA_BUILD_POC=OFF
          -DTESSERA_BUILD_VULKAN=OFF
          -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build native compiler
        run: cmake --build build/native-pages --target tessera_codegen_cli --parallel

      # Every sample, assembled as the Studio opens it from a clone's repository root (entry plus the
      # library files copied next to it, `lib/sample-folder.ts`), must compile with no unresolved import
      # under the real native compiler. This replaced the committed sample manifest's drift check.
      - name: Sample projects (every sample resolves its imports and compiles)
        run: >-
          node scripts/ci/preview_sample_projects.mjs
          --codegen build/native-pages/src/compiler/codegen/tessera_codegen

      - name: Diagnostics parity (native vs Wasm)
        run: >-
          python3 -B scripts/ci/wasm_diagnostics_parity.py
          --native build/native-pages/src/compiler/codegen/tessera_codegen
          --wasm build/wasm-webgpu/src/compiler/codegen/tessera_diagnostics.js
          --node "$EMSDK_NODE"

      # P2's acceptance sentence, checked before anything is published: the scene snapshot the page
      # shows must equal the native harness's document for every corpus case, byte for byte, with a
      # declared minimum node count per case so "both empty" cannot pass.
      - name: Build native scene-preview CLI
        run: cmake --build build/native-pages --target tessera_scene_preview_cli --parallel

      - name: Scene snapshot parity (native vs Wasm)
        run: >-
          python3 -B scripts/ci/scene_snapshot_parity.py
          --native build/native-pages/src/compiler/codegen/tessera_scene_preview
          --wasm build/wasm-webgpu/src/compiler/codegen/tessera_scene_preview.js
          --node "$EMSDK_NODE"

      # P5 (issue #169): the Problems model, the page chrome, and the page's built wiring. All of them need
      # Node but not Wasm: the model is a pure module of the front end's `dist-ssr/` bundle, and the chrome is
      # rendered from the same bundle (ADR-054 decision 6 -- React creates the DOM at runtime, so "every id
      # exists" is asserted against `renderToStaticMarkup` rather than against a static file). They run
      # BEFORE the site is assembled.
      #
      # What they do NOT prove: that a browser paints the page. That is this lane's deploy and a human
      # opening the URL (or the developer-run `preview_browser_check.mjs`). The scripts say so themselves.
      - name: Problems model (severity counts, filter, store, no browser)
        run: node scripts/ci/preview_problems.mjs

      # The page side of project search (#580): the client around the worker and the multi-file replace history.
      - name: Project search client and replace history
        run: node scripts/ci/preview_search_client.mjs

      - name: Editor code intelligence wiring (F12, Shift+F12, hover, completion, rename; #984 #988)
        run: node scripts/ci/preview_analysis_wiring.mjs
        env:
          TESSERA_ANALYSIS_WASM: build/wasm-webgpu/src/compiler/analysis/tessera_analysis.js

      # #575, #569: the page's analysis and compile clients over the real worker sources (stand-in engines):
      # a file that is not open reaches the Problems store, fixing it clears the row, an unavailable module is
      # quiet, and a killed compile worker restarts from the next snapshot.
      - name: Project-wide Problems (analysis and compile clients, no browser)
        run: node scripts/ci/preview_project_problems.mjs

      # The project load and save, against an in-memory folder handle: a folder and its zip are the same
      # project, every limit refuses before a byte is read, a locked file is never read, and Save notices a
      # file that changed on disk. The browser half is `preview_browser_project_io.mjs`, run by hand.
      - name: Project load and save (limits, locked files, conflicts)
        run: node scripts/ci/preview_project_load.mjs

      # Folder move and folder delete plans: every file under the prefix, locked files and escapes refused.
      - name: Project folder operations
        run: node scripts/ci/preview_project_folder_ops.mjs

      # A generated header older than its source gets a "may be out of date" hint (heuristic, advisory).
      - name: Generated-file staleness advice
        run: node scripts/ci/preview_generated_staleness.mjs

      # The recent-projects list policy (newest first, one per folder, at most ten, storage-less is empty).
      - name: Recent projects list
        run: node scripts/ci/preview_recent_projects.mjs

      # Version history (#583): snapshot cap/dedupe/budget, exact restore, the line diff, throwing storage.
      - name: Version history
        run: node scripts/ci/preview_snapshots.mjs

      # The project package: zip + manifest with times, versioning, tamper refusal, plain zips still open.
      - name: Project package format
        run: node scripts/ci/preview_project_package.mjs

      - name: Studio mock services (file kind, subset, table, trace, host)
        run: node scripts/ci/preview_mock_host.mjs

      - name: Studio mock sandbox (hostile fixtures, caps)
        run: node scripts/ci/preview_mock_sandbox.mjs

      - name: Studio services protocol (no-UI harness, ADR-060)
        run: node scripts/ci/preview_studio_services.mjs

      - name: Format service (edit list over the worker protocol, ADR-061)
        run: node scripts/ci/preview_format_service.mjs

      # Project search (#580): globs, plain and bounded-regex matching, caps, the replace plan, the worker protocol.
      - name: Search service (matcher, bounded regex engine, replace plan, ADR-060)
        run: node scripts/ci/preview_search_service.mjs

      # With the Wasm module the gate also checks the C++ library end to end (UTF-16 spans, findings).
      # The compile worker is the diagnostics view's engine (#569); with the Wasm module the gate also runs the
      # real compiler through the page's engine source.
      - name: Compile service (diagnostics view over the worker protocol, ADR-060)
        run: node scripts/ci/preview_compile_service.mjs
        env:
          TESSERA_DIAGNOSTICS_WASM: build/wasm-webgpu/src/compiler/codegen/tessera_diagnostics.js

      - name: Analysis service (diagnostics over the worker protocol, ADR-060)
        run: node scripts/ci/preview_analysis_service.mjs
        env:
          TESSERA_ANALYSIS_WASM: build/wasm-webgpu/src/compiler/analysis/tessera_analysis.js

      - name: Theme asset hand-over (token commits)
        run: node scripts/ci/preview_theme_handover.mjs

      - name: Style override client (set/clear/revert, commit round trip, Undo/Redo routing)
        run: node scripts/ci/preview_override_client.mjs

      # The workbench core (commands, when-clauses, keymap, menus, palette): pure modules, no browser.
      - name: Studio workbench core (registry, keymap, menus, palette)
        run: node scripts/ci/preview_workbench.mjs

      - name: Studio workbench menus (model, keyboard navigation)
        run: node scripts/ci/preview_workbench_menus.mjs

      - name: Studio command palette (fuzzy ranking, recent list, argument prompts)
        run: node scripts/ci/preview_workbench_palette.mjs

      - name: Studio accent tokens (WCAG AA contrast, light/dark parity)
        run: node scripts/ci/studio_accent_contrast.mjs

      - name: Studio notifications (queue, dedupe, history, do not disturb)
        run: node scripts/ci/preview_workbench_notifications.mjs

      - name: Studio chrome smoke (rendered build, stub browser)
        run: node scripts/ci/preview_studio_smoke.mjs

      - name: Live edit applies instead of restarting (plain Node)
        run: node scripts/ci/preview_live_edit_wiring.mjs

      - name: Canvas pane states (not applied, nothing to draw; never a silent blank)
        run: node scripts/ci/preview_canvas_pane_states.mjs

      - name: Canvas zoom (fit, steps, anchored wheel zoom; never an input to the app)
        run: node scripts/ci/preview_canvas_zoom.mjs

      - name: Canvas typed text (hidden textarea, IME, clipboard, Tab never traps; fake DOM)
        run: node scripts/ci/preview_canvas_text.mjs

      - name: Canvas drag-resize arithmetic (handles, the zoom, the per-frame step rule)
        run: node scripts/ci/preview_canvas_resize.mjs

      - name: Canvas viewport limits (the clamp that keeps a size from losing the device)
        run: node scripts/ci/preview_viewport_limits.mjs

      - name: Fold overlay geometry (the hinge band and the insets, scaled from the engine's report)
        run: node scripts/ci/preview_fold_overlay.mjs

      # The built half: `dist/index.html` is CSP-clean and its asset references resolve, the rendered
      # chrome carries every id the page's code looks up, the redirect stubs preserve the query and the
      # `#p5=` fragment, every manifest path exists, the two codec modules are still pure ES modules, the
      # three Wasm modules are still three lazy `import()`s, and no module calls a function its own
      # refactor deleted. Several of the failures this checks for actually shipped into a draft of P5.
      - name: Page wiring checks (built output, ids, no bundled samples)
        run: node scripts/ci/preview_page_checks.mjs

      # The skins slice's acceptance (issue #171, `designer-studio-v1.md` sections 5.1 and 5.2):
      # "geometry and retint tests". Every bundled manifest parses and validates, a missing required
      # field / an inset larger than the screen / a negative size is rejected with
      # `TESSERA_STUDIO_SKIN`, the derived viewer size is `size` minus `bezel` for each category, the
      # three geometry modes draw what section 5.1 says, and no manifest or SVG frame carries a
      # colour - chrome colours come from the theme, so a theme switch retints the frame and the
      # canvas in the same frame. The validator is imported from `dist-ssr/`, so this tests the rules
      # the page ships rather than a copy of them.
      - name: Skin manifests, geometry and retint (built validator, no browser)
        run: node scripts/ci/preview_skins.mjs

      # The workbench layout model (issue #556, `studio-workbench-layout-v1.md` sections 1 to 3): the
      # validator's every rule, the operations and canonical flattening, migration fixtures, reconcile,
      # the phone projection and localStorage persistence, imported from `dist-ssr/workbench.js`.
      - name: Workbench layout model (built, no browser)
        run: node scripts/ci/workbench_layout.mjs

      # The dock adapter's pure core (issue #560): the model <-> flexlayout-react round trip through the real
      # library `Model`, the gesture map, and the splitter arithmetic and ARIA values.
      - name: Workbench dock adapter core (built, no browser)
        run: node scripts/ci/workbench_dock_core.mjs

      # The page stages its project (`tessera_project_*`) and then asks one scene export, whose viewport
      # and DPR are real layout inputs. A module missing either would show up here instead of as a page
      # that previews nothing or quietly falls back to 320x240.
      - name: Scene module exports the project staging and the scene entry point
        run: |
          set -euo pipefail
          module=build/wasm-webgpu/src/compiler/codegen/tessera_scene_preview.js
          for name in _tessera_project_begin _tessera_project_add_source _tessera_project_add_stylesheet                       _tessera_project_set_entry _tessera_scene_json _tessera_input_json; do
            grep -q "$name" "$module"
          done
          echo "the scene module exports the project staging and tessera_scene_json"

      # P3's module, checked for the one thing this lane can check without a GPU: the canvas module
      # loads under Node (which has no `navigator.gpu`, exactly like a browser without WebGPU) and
      # honours the no-device contract instead of crashing. That contract is what makes the page show
      # its "unsupported browser" state instead of a blank canvas.
      #
      # The PIXEL half of P3's acceptance is NOT here: Node has no WebGPU device, and this runner has
      # no display, so no frame can be drawn in this job. See docs/design/compiler-wasm.md section 8
      # for what proves the pixels and where.
      - name: Canvas module no-device contract (Node)
        run: >-
          python3 -B scripts/ci/scene_frame_parity.py --mode canvas-report
          --canvas build/wasm-webgpu/src/compiler/codegen/tessera_canvas.js
          --node "$EMSDK_NODE"

      # The font ABI (issue #387): the page fetches one face and hands the bytes over, so the two
      # exports and the pointer-plus-size contract are part of what ships. Node has no device, hence the
      # refusal branch; the glyphs are proven by the native lane.
      - name: Canvas module font ABI (Node)
        run: >-
          python3 -B scripts/ci/scene_frame_parity.py --mode canvas-font
          --canvas build/wasm-webgpu/src/compiler/codegen/tessera_canvas.js
          --node "$EMSDK_NODE"

      # The Resources controls (issue #657): the page's request/report vocabulary, the stand-in ABI check,
      # and the scene module driven through a resource's whole cycle (Node has no WebGPU device, so the
      # canvas session itself is browser-only; the canvas export is checked for its no-session answer).
      - name: Resource controls (vocabulary, ABI order, scene module cycle, canvas export)
        run: >-
          node scripts/ci/preview_resource_controls.mjs
          --scene-module build/wasm-webgpu/src/compiler/codegen/tessera_scene_preview.js
          --canvas-module build/wasm-webgpu/src/compiler/codegen/tessera_canvas.js

      # Assemble the site from the **built** page plus the three Wasm artifacts.
      #
      # Issue #422 converted the page to React 19 + Vite (ADR-054), so there is no longer a hand-written
      # page to copy: `designer/web/dist/` is what a browser downloads, and it carries content-hashed
      # asset names (`assets/index-<hash>.js`). `dist/` already includes the files Vite copies from
      # `designer/web/public/`, which is why the copies below are only the Wasm modules and the build id.
      # The samples are not published: a visitor opens them from a clone of the repository.
      #
      # The old fixed `test -f` list cannot survive content hashes, so the integrity check is derived from
      # the document instead: every asset `dist/index.html` references must exist in the artifact. That is
      # a stronger check than the list it replaces -- it fails on a dangling reference the list would not
      # have named, and it cannot go stale when the build renames a chunk.
      - name: Assemble site
        run: |
          set -euo pipefail
          site=build/pages
          rm -rf "$site"
          mkdir -p "$site"
          # The built front end (issue #422): index.html, the hashed JS/CSS chunks, and the public files
          # Vite copies verbatim. Copied with a trailing `/.` so `dist`'s contents land at the site root.
          cp -R designer/web/dist/. "$site/"
          # The three Wasm modules stay three (ADR-054 decision 3, and #392's merge did not merge them):
          # each is a lazy `import()` from the page's own base, so they are copied next to `index.html`
          # and never bundled.
          for module in tessera_diagnostics tessera_scene_preview tessera_canvas; do
            cp "build/wasm-webgpu/src/compiler/codegen/$module.js" "$site/"
            cp "build/wasm-webgpu/src/compiler/codegen/$module.wasm" "$site/"
          done
          # The format worker's module is its own file: a lazy `import()` on the first Format Document.
          cp build/wasm-webgpu/tools/fmt/tessera_format.js "$site/"
          cp build/wasm-webgpu/tools/fmt/tessera_format.wasm "$site/"
          # The analysis worker's module (#568): lazy on the first diagnostics request, weighed by
          # lazy_service_modules_gzip_bytes together with the format module.
          cp build/wasm-webgpu/src/compiler/analysis/tessera_analysis.js "$site/"
          cp build/wasm-webgpu/src/compiler/analysis/tessera_analysis.wasm "$site/"
          # The build id the page displays (D-S5 acceptance: the URL serves the current build).
          printf '%s\n' "${GITHUB_SHA}" > "$site/build-id.txt"
          # A static host resolves the directory to index.html; make the intent explicit and fail loudly
          # if the page is missing rather than publishing an empty artifact.
          test -f "$site/index.html"

          # Every asset the built document references must exist. A dangling `src`/`href` is a page whose
          # chrome silently loses its stylesheet or its bundle, which no other step in this lane sees.
          #
          # HTML comments are stripped first: the page's own header comment explains the CSP and quotes
          # `<script type="module">`, and a scan of the comments would report the explanation as the
          # violation. `preview_page_checks.mjs` does the same thing for the same reason.
          python3 - "$site" <<'PY'
          import pathlib, re, sys

          site = pathlib.Path(sys.argv[1])
          raw = (site / "index.html").read_text(encoding="utf-8")
          page = re.sub(r"<!--.*?-->", "", raw, flags=re.S)
          references = re.findall(r'<(?:script|link)\b[^>]*\b(?:src|href)="([^"]+)"', page)
          local = [
              url for url in references
              if not re.match(r"^(?:[a-z]+:|//)", url, re.I)
          ]
          assert len(local) >= 2, f"expected a script and a stylesheet, found {local}"
          for url in local:
              target = (site / url.lstrip("./")).resolve()
              assert str(target).startswith(str(site.resolve())), f"asset escapes the site: {url}"
              assert target.is_file(), f"index.html references a missing asset: {url}"
          # No inline script: the page's CSP is "no inline script, no remote script" (ADR-054 decision 4).
          for attributes in re.findall(r"<script\b([^>]*)>", page):
              assert "src=" in attributes, f"index.html has an inline <script{attributes}>"
          assert 'id="root"' in page, "index.html has no #root mount point"
          print(f"{len(local)} asset reference(s) from index.html all present")
          PY

          # The Studio bundles no samples (they open from the visitor's clone), so none may be published.
          if [ -e "$site/samples.json" ] || [ -e "$site/samples" ]; then
            echo "the site publishes samples; the Studio opens them from a clone"; exit 1
          fi

          ls -l "$site"

      # P6 of docs/design/reference-equantic-ui.md section 7.4 (issue #170): the size and latency
      # budgets, measured against the exact module this job just built and assembled.
      #
      # This runs HERE, in the lane that already has the artifact, for three reasons:
      #   - the numbers are about the shipped bytes, so measuring anything else would be measuring a
      #     different product;
      #   - it needs no second Wasm build, and the emsdk install above is already paid for;
      #   - it is the only lane that has both Node ($EMSDK_NODE) and the module at the same time.
      #
      # What each row does to the build:
      #   download_gzip_bytes  ENFORCED. Deterministic (the built page plus all three modules the
      #                        studio loads), so a regression fails this job, and the per-file
      #                        recorded breakdown must agree with the measurement so a growth names
      #                        the file that caused it.
      #   cold_engine_ready_ms ENFORCED. Wall clock made portable: the probe times a fixed integer
      #                        workload and the row is measured_ms * reference_ms / calibration_ms,
      #                        so this runner's speed cancels. The raw figure is printed beside it as
      #                        cold_engine_ready_raw_ms for triage.
      #   edit_compile_ms      ENFORCED. Same normalization; edit_compile_raw_ms is printed beside it.
      # The header of scripts/check_preview_budget.py explains the choice, the limits of that
      # normalization (measured on one host) and what to do if it stops holding, and
      # tests/golden/perf/preview_budget.json records the pins, tolerances and the reason.
      #
      # A missing module is a setup error (exit 2), not a pass: a budget nobody measured is not a
      # budget that passed. So this step also proves the assembled site is complete.
      - name: Preview size and latency budgets
        run: >-
          python3 -B scripts/check_preview_budget.py --check
          --module-dir build/pages
          --node "$EMSDK_NODE"

      # P3's browser half (issue #375): the WebGPU **device handover**, which no static check can see.
      #
      # `--enable-unsafe-webgpu` gives headless Chromium a SwiftShader adapter *and* a device on a
      # runner with no GPU, so this is a real gate: it opens the assembled page, opens a project, and
      # requires the canvas to draw (`drawCalls > 0`). #375's bug was that the page handed the module
      # the JS `GPUDevice` object, which coerced to a null handle, so the module reported "no device"
      # and never drew while every other step stayed green. The same script asserts both unsupported
      # headings ("this browser has no WebGPU" vs "the module could not take the device"), which is
      # #375's second acceptance sentence.
      #
      # It runs HERE, after "Assemble site", because it serves `build/pages` itself -- the artifact
      # under test, not a directory of sources. What it does NOT prove is the P3 pixel comparison
      # (issue #167): a software adapter is not a pixel reference, and `canvas-native-parity` owns the
      # lavapipe goldens.
      - name: Install the browser gates' Node dependencies
        run: npm ci --prefix scripts/ci

      # The browser download is ~130 MB and changes only when the Playwright version does, so it is
      # cached against the lockfile rather than repeated on every push. `playwright install` is
      # idempotent: a warm cache makes it a no-op, which is the point.
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/ci/package-lock.json') }}

      - name: Install headless Chromium for the browser gates
        run: npx --prefix scripts/ci playwright install --with-deps chromium

      - name: Canvas device handover (headless Chromium + SwiftShader)
        run: >-
          node scripts/ci/preview_browser_canvas_handover.mjs build/pages

      # The canvas backing store and its CSS box follow the viewport through the Device menu, at DPR 1
      # and 2 (issue #598). No device is needed for the property itself: it is `canvas.width`, which the
      # session writes, against the frame counter the pane shows.
      - name: Canvas size follows the viewport (headless Chromium)
        run: >-
          node scripts/ci/preview_browser_canvas_size.mjs build/pages

      # The fold-hinge and safe-area overlay (issue #433). A browser is needed because the overlay is
      # wired from the same refs the resize grips are: the session is created before React commits the
      # element, so a listener or a lookup that runs too early leaves it silently empty.
      - name: Fold overlay over the preview (headless Chromium)
        run: >-
          node scripts/ci/preview_browser_fold_overlay.mjs build/pages

      # The module is loaded as an ES module by the page, so a wrong MIME type on the host would
      # break it; GitHub Pages serves .js as JavaScript and .wasm as application/wasm, which is why
      # ADR-045 chose it. Nothing to configure, but the artifact is uploaded even when the deploy is
      # skipped so a reviewer can download and open it.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    # Deployment needs the artifact, and it is main-only: a PR builds the page but never publishes it.
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # The two scopes `actions/deploy-pages` needs.
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The guard. Pages is a repository setting this workflow cannot enable, so probe it and skip
      # cleanly when it is off instead of failing main.
      #
      # It FAILS CLOSED: the deploy step runs only on an explicit successful probe, so *any* other
      # outcome skips rather than deploying. That covers the three cases distinctly, because a
      # network or auth error is not the same thing as "Pages is disabled" and the summary must not
      # claim it is:
      #   404 / "Not Found"  -> Pages is not enabled; skip, tell the owner what to do
      #   another non-zero   -> the probe itself failed (network, token, rate limit); skip, say so
      #   0                  -> Pages exists; deploy
      # A skipped deploy is not a failed job: main stays green until the owner enables Pages.
      - name: Check whether GitHub Pages is enabled
        id: pages-enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          probe="repos/${{ github.repository }}/pages"
          status=0
          detail="$(gh api "$probe" 2>&1 >/dev/null)" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; deploying."
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice::GitHub Pages probe failed (exit $status); skipping the deploy."
          {
            echo "### Preview page: not deployed"
            echo ""
            if printf '%s' "$detail" | grep -qi 'not found'; then
              echo "GitHub Pages is **not enabled** on this repository, so there is no site to"
              echo "publish to. The page was built and uploaded as an artifact."
              echo ""
              echo "**Owner action:** Settings -> Pages -> Source: **GitHub Actions**. The next push"
              echo "to main deploys automatically."
            else
              echo "The Pages probe itself failed, so the deploy was skipped rather than attempted"
              echo "(it is guarded so a probe failure cannot turn main red). This is *not* proof that"
              echo "Pages is disabled."
              echo ""
              echo '```'
              printf '%s\n' "$detail" | head -n 20
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages-enabled.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
