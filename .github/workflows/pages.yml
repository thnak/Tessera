# The preview page (issue #165, P1 of docs/design/reference-equantic-ui.md section 7.4; studio slice
# D-S5 in docs/specs/designer-studio-v1.md section 12).
#
# Two jobs with different risk:
#
#   build    Assembles the page: the static files in designer/web/ plus the Emscripten diagnostics
#            module built from this commit. It ALWAYS runs on main and on a pull request, and it is a
#            real check - it proves the page and the Wasm module assemble together and that the
#            diagnostics gate passes against the native CLI.
#
#   deploy   Publishes the artifact to GitHub Pages at https://thnak.github.io/Tessera/. It is
#            GUARDED, so a repository where Pages is off (a fork, or this repo before 2026-11-15)
#            skips instead of going red.
#
# Why the deploy stays guarded:
#   GitHub Pages is a repository *setting*, not something a workflow file can turn on. If `deploy`
#   ran unguarded, `actions/deploy-pages` would fail on every push to a repository without it and
#   make main red for a reason no code change caused. Pages is enabled here (Settings -> Pages ->
#   Source: "GitHub Actions"), and the deploy of #165 was the proof that the guard's success path
#   works; the guard is kept for forks and for a repo where the setting is later turned off.
#
#     - Pages enabled: the `pages` API exists, the guard's probe succeeds, and the job deploys;
#     - Pages absent (404) or the probe failing: the job skips with a notice naming which it was;
#     - a PR never deploys (deployment is main-only, ADR-045 decision 1).
#
#   The probe is a `gh api` call, so it needs no secret beyond the workflow token, and it treats any
#   non-200 as "not enabled" rather than as an error.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'designer/web/**'
      - 'samples/**'
      - 'tools/codegen/**'
      - 'src/compiler/**'
      - 'scripts/ci/wasm_diagnostics_parity.py'
      - 'scripts/ci/preview_budget_probe.mjs'
      - 'scripts/ci/preview_share_roundtrip.mjs'
      - 'scripts/ci/preview_studio_smoke.mjs'
      - 'scripts/ci/preview_page_checks.mjs'
      - 'scripts/ci/gen_sample_manifest.py'
      - 'scripts/check_preview_budget.py'
      - 'scripts/preview_budget_measure.py'
      - 'scripts/preview_budget_ratchet.py'
      - 'tests/golden/perf/preview_budget.json'
      - 'scripts/ci/scene_snapshot_parity.py'
      - 'scripts/ci/scene_frame_parity.py'
      - 'scripts/ci/scene_frame_canvas_probe.mjs'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'designer/web/**'
      - 'samples/**'
      - 'tools/codegen/**'
      - 'src/compiler/**'
      - 'scripts/ci/wasm_diagnostics_parity.py'
      - 'scripts/ci/preview_budget_probe.mjs'
      - 'scripts/ci/preview_share_roundtrip.mjs'
      - 'scripts/ci/preview_studio_smoke.mjs'
      - 'scripts/ci/preview_page_checks.mjs'
      - 'scripts/ci/gen_sample_manifest.py'
      - 'scripts/check_preview_budget.py'
      - 'scripts/preview_budget_measure.py'
      - 'scripts/preview_budget_ratchet.py'
      - 'tests/golden/perf/preview_budget.json'
      - 'scripts/ci/scene_snapshot_parity.py'
      - 'scripts/ci/scene_frame_parity.py'
      - 'scripts/ci/scene_frame_canvas_probe.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# A new push to a pull request cancels the run it supersedes; runs on main are never cancelled (a
# cancelled deploy would leave the site half-published).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Read emsdk pin
        run: echo "EMSDK_VERSION=$(cat tools/emsdk-version.txt)" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # Same emsdk cache key as the WebGPU lane, so the two workflows share the download instead of
      # fetching the SDK twice.
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" \
            https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"

      - name: Activate emsdk
        run: |
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"

      - name: Configure (wasm-webgpu)
        run: |
          emcc --version | head -n1
          cmake --preset wasm-webgpu

      # The same target the parity gate drives, built once here and shipped as the page's module.
      - name: Build browser diagnostics module
        run: cmake --build build/wasm-webgpu --target tessera_diagnostics_wasm --parallel

      # P2 (issue #166): the scene-preview module behind the merged page's Scene view. Same configure
      # and the same pattern; issue #392 merged the pages without merging the modules.
      - name: Build browser scene-preview module
        run: cmake --build build/wasm-webgpu --target tessera_scene_preview_wasm --parallel

      # P3 (issue #167): the canvas module behind the merged page's Canvas view. It links
      # tessera_webgpu, so the same `wasm-webgpu` configure brings the WebGPU backend and the
      # emdawnwebgpu port, and the wasm build proves the module compiles and links against them before
      # anything is published.
      - name: Build browser canvas module
        run: cmake --build build/wasm-webgpu --target tessera_canvas_wasm --parallel

      # The page must not ship a module that does not load, and it must not ship one that disagrees
      # with the native compiler. This is the same gate the WebGPU lane runs, over the same corpus;
      # it needs a native CLI, so a minimal native configure comes along (compiler only).
      - name: Configure (native, compiler only)
        run: >
          cmake -S . -B build/native-pages -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTESSERA_BUILD_TESTS=OFF
          -DTESSERA_BUILD_POC=OFF
          -DTESSERA_BUILD_VULKAN=OFF
          -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build native compiler
        run: cmake --build build/native-pages --target tessera_codegen_cli --parallel

      - name: Diagnostics parity (native vs Wasm)
        run: >-
          python3 -B scripts/ci/wasm_diagnostics_parity.py
          --native build/native-pages/src/compiler/codegen/tessera_codegen
          --wasm build/wasm-webgpu/src/compiler/codegen/tessera_diagnostics.js
          --node "$EMSDK_NODE"

      # P2's acceptance sentence, checked before anything is published: the scene snapshot the page
      # shows must equal the native harness's document for every corpus case, byte for byte, with a
      # declared minimum node count per case so "both empty" cannot pass.
      - name: Build native scene-preview CLI
        run: cmake --build build/native-pages --target tessera_scene_preview_cli --parallel

      - name: Scene snapshot parity (native vs Wasm)
        run: >-
          python3 -B scripts/ci/scene_snapshot_parity.py
          --native build/native-pages/src/compiler/codegen/tessera_scene_preview
          --wasm build/wasm-webgpu/src/compiler/codegen/tessera_scene_preview.js
          --node "$EMSDK_NODE"

      # P5 (issue #169): the share-link round trip, the page chrome under a stub DOM, the page's
      # static wiring, and the sample manifest's drift. All four need Node but not Wasm: the codec is a
      # pure ES module, the chrome is driven through a stub DOM, and the manifest is generated from
      # samples/. They run BEFORE the site is assembled, so a broken link format cannot be published.
      #
      # What they do NOT prove: that a browser paints the page. That is this lane's deploy and a human
      # opening the URL. The scripts say so in their own headers.
      - name: Share-link round trip (codec, no browser)
        run: node scripts/ci/preview_share_roundtrip.mjs

      - name: Page chrome smoke (stub DOM)
        run: node scripts/ci/preview_studio_smoke.mjs

      # The static half: every element `studio.js` and the three views look up exists in the merged
      # page, the redirect stubs preserve the query and the `#p5=` fragment, every manifest path
      # exists, and no page module calls a function its own refactor deleted. Both failures this checks
      # for actually shipped into a draft of P5.
      - name: Page wiring checks (ids, redirects, sample paths, dangling calls)
        run: node scripts/ci/preview_page_checks.mjs

      - name: Sample manifest is generated and current
        run: python3 -B scripts/ci/gen_sample_manifest.py --check

      # The viewport and DPR toggles reach the layout through a second export, so the module the page
      # ships must actually export it. A missing `_tessera_scene_json_sized` would show up here as a
      # page that quietly falls back to 320x240, which is exactly the kind of silent regression this
      # step exists to prevent.
      - name: Scene module exports the sized entry point
        run: |
          set -euo pipefail
          module=build/wasm-webgpu/src/compiler/codegen/tessera_scene_preview.js
          grep -q '_tessera_scene_json_sized' "$module"
          echo "the scene module exports tessera_scene_json_sized"

      # P3's module, checked for the one thing this lane can check without a GPU: the canvas module
      # loads under Node (which has no `navigator.gpu`, exactly like a browser without WebGPU) and
      # honours the no-device contract instead of crashing. That contract is what makes the page show
      # its "unsupported browser" state instead of a blank canvas.
      #
      # The PIXEL half of P3's acceptance is NOT here: Node has no WebGPU device, and this runner has
      # no display, so no frame can be drawn in this job. See docs/design/compiler-wasm.md section 8
      # for what proves the pixels and where.
      - name: Canvas module no-device contract (Node)
        run: >-
          python3 -B scripts/ci/scene_frame_parity.py --mode canvas-report
          --canvas build/wasm-webgpu/src/compiler/codegen/tessera_canvas.js
          --node "$EMSDK_NODE"

      # Assemble the site: the hand-written page plus the three artifacts the modules need. Nothing is
      # built here - the page has no build step of its own by design (issue #165).
      #
      # Issue #392 merged the three pages into one `index.html`: the file list below is the merged page
      # and its views, and it is the same list as `PAGE_FILES` in `scripts/preview_budget_measure.py`
      # (the two are read together, and a file missing from either is a file that ships unweighed or a
      # page that throws on load).
      - name: Assemble site
        run: |
          set -euo pipefail
          site=build/pages
          rm -rf "$site"
          mkdir -p "$site"
          cp -R designer/web/. "$site/"
          # P5's sample gallery fetches `samples/<path>` from the page's own origin (issue #169). The
          # TSX is the single source of truth and is copied verbatim, never inlined into the manifest;
          # without this the gallery 404s in production while passing every local test, because a
          # checkout has samples/ next to designer/ but the assembled site does not.
          mkdir -p "$site/samples"
          cp -R samples/. "$site/samples/"
          cp build/wasm-webgpu/src/compiler/codegen/tessera_diagnostics.js "$site/"
          cp build/wasm-webgpu/src/compiler/codegen/tessera_diagnostics.wasm "$site/"
          cp build/wasm-webgpu/src/compiler/codegen/tessera_scene_preview.js "$site/"
          cp build/wasm-webgpu/src/compiler/codegen/tessera_scene_preview.wasm "$site/"
          # P3's canvas module (issue #167). Both modules are published: the merged page must keep the
          # Scene view working in a browser without WebGPU (design section 7.5), so the Canvas view is
          # never the only way to see a scene.
          cp build/wasm-webgpu/src/compiler/codegen/tessera_canvas.js "$site/"
          cp build/wasm-webgpu/src/compiler/codegen/tessera_canvas.wasm "$site/"
          # The build id the page displays (D-S5 acceptance: the URL serves the current build).
          printf '%s\n' "${GITHUB_SHA}" > "$site/build-id.txt"
          # A static host resolves the directory to index.html; make the intent explicit and fail
          # loudly if the page is missing rather than publishing an empty artifact.
          test -f "$site/index.html"
          test -f "$site/app.css"
          test -f "$site/tessera_diagnostics.js"
          test -f "$site/tessera_diagnostics.wasm"
          # The merged page's shell and the three views (issue #392). Every one of these is imported by
          # `studio-page.js` (directly or through a view's lazy import); a missing file is a pane that
          # throws when it is first opened, which no CI step here would otherwise catch.
          test -f "$site/studio-page.js"
          test -f "$site/shell.js"
          test -f "$site/view-diagnostics.js"
          test -f "$site/diagnostics-view-render.js"
          test -f "$site/view-scene.js"
          test -f "$site/scene-view-render.js"
          test -f "$site/view-canvas.js"
          test -f "$site/canvas-device.js"
          test -f "$site/canvas-pane.js"
          test -f "$site/wasm-call.js"
          test -f "$site/tessera_scene_preview.js"
          test -f "$site/tessera_scene_preview.wasm"
          # P5's page modules and the generated sample manifest (issue #169). A missing one of these
          # is a page that throws on load in the browser, which no CI step here would otherwise catch,
          # so the artifact is checked for them before it is uploaded.
          test -f "$site/preview-state.js"
          test -f "$site/share.js"
          test -f "$site/gallery.js"
          test -f "$site/studio.js"
          test -f "$site/scene-input.js"
          test -f "$site/samples.json"
          # The pre-merge URLs (issue #392). They must still resolve -- a link or a bookmark made before
          # the merge is somebody's project state -- and each must carry the redirect script that moves
          # the visitor to `index.html` with the query and the `#p5=` fragment intact.
          test -f "$site/scene.html"
          test -f "$site/canvas.html"
          test -f "$site/redirect.js"
          # The manifest names repository paths; every one of them must exist in the artifact or the
          # gallery offers a button that cannot load.
          python3 - "$site" <<'PY'
          import json, pathlib, sys
          site = pathlib.Path(sys.argv[1])
          samples = json.loads((site / "samples.json").read_text(encoding="utf-8"))["samples"]
          assert samples, "the manifest lists no samples"
          for entry in samples:
              target = site / entry["path"]
              assert target.is_file(), f"manifest path missing from the site: {entry['path']}"
          print(f"{len(samples)} manifest path(s) present in the site")
          PY

          test -f "$site/tessera_canvas.js"
          test -f "$site/tessera_canvas.wasm"
          ls -l "$site"

      # P6 of docs/design/reference-equantic-ui.md section 7.4 (issue #170): the size and latency
      # budgets, measured against the exact module this job just built and assembled.
      #
      # This runs HERE, in the lane that already has the artifact, for three reasons:
      #   - the numbers are about the shipped bytes, so measuring anything else would be measuring a
      #     different product;
      #   - it needs no second Wasm build, and the emsdk install above is already paid for;
      #   - it is the only lane that has both Node ($EMSDK_NODE) and the module at the same time.
      #
      # What each row does to the build:
      #   download_gzip_bytes  ENFORCED. Deterministic, so a regression fails this job.
      #   cold_engine_ready_ms WARN. Wall clock; printed every run and never fails the lane.
      #   edit_compile_ms      WARN. Same.
      # The header of scripts/check_preview_budget.py explains both choices, and
      # tests/golden/perf/preview_budget.json records the pins, tolerances and the reason.
      #
      # A missing module is a setup error (exit 2), not a pass: a budget nobody measured is not a
      # budget that passed. So this step also proves the assembled site is complete.
      - name: Preview size and latency budgets
        run: >-
          python3 -B scripts/check_preview_budget.py --check
          --module-dir build/pages
          --node "$EMSDK_NODE"

      # The module is loaded as an ES module by the page, so a wrong MIME type on the host would
      # break it; GitHub Pages serves .js as JavaScript and .wasm as application/wasm, which is why
      # ADR-045 chose it. Nothing to configure, but the artifact is uploaded even when the deploy is
      # skipped so a reviewer can download and open it.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    # Deployment needs the artifact, and it is main-only: a PR builds the page but never publishes it.
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # The two scopes `actions/deploy-pages` needs.
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The guard. Pages is a repository setting this workflow cannot enable, so probe it and skip
      # cleanly when it is off instead of failing main.
      #
      # It FAILS CLOSED: the deploy step runs only on an explicit successful probe, so *any* other
      # outcome skips rather than deploying. That covers the three cases distinctly, because a
      # network or auth error is not the same thing as "Pages is disabled" and the summary must not
      # claim it is:
      #   404 / "Not Found"  -> Pages is not enabled; skip, tell the owner what to do
      #   another non-zero   -> the probe itself failed (network, token, rate limit); skip, say so
      #   0                  -> Pages exists; deploy
      # A skipped deploy is not a failed job: main stays green until the owner enables Pages.
      - name: Check whether GitHub Pages is enabled
        id: pages-enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          probe="repos/${{ github.repository }}/pages"
          status=0
          detail="$(gh api "$probe" 2>&1 >/dev/null)" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; deploying."
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice::GitHub Pages probe failed (exit $status); skipping the deploy."
          {
            echo "### Preview page: not deployed"
            echo ""
            if printf '%s' "$detail" | grep -qi 'not found'; then
              echo "GitHub Pages is **not enabled** on this repository, so there is no site to"
              echo "publish to. The page was built and uploaded as an artifact."
              echo ""
              echo "**Owner action:** Settings -> Pages -> Source: **GitHub Actions**. The next push"
              echo "to main deploys automatically."
            else
              echo "The Pages probe itself failed, so the deploy was skipped rather than attempted"
              echo "(it is guarded so a probe failure cannot turn main red). This is *not* proof that"
              echo "Pages is disabled."
              echo ""
              echo '```'
              printf '%s\n' "$detail" | head -n 20
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages-enabled.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
