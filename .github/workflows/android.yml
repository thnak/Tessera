# SPDX-License-Identifier: MIT

name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ccache
        with:
          name: android

      - name: Configure (NDK, arm64-v8a, null backend)
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -S . -B build/android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTESSERA_BUILD_TESTS=OFF \
            -DTESSERA_BUILD_VULKAN=OFF \
            -DTESSERA_BUILD_POC=OFF \
            -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/android --parallel

      # Separate x86_64 build so the tests can run on the Linux x86_64 emulator.
      - name: Configure tests (x86_64 emulator, null backend)
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -S . -B build/android-tests \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DTESSERA_BUILD_TESTS=ON \
            -DTESSERA_BUILD_VULKAN=OFF \
            -DTESSERA_BUILD_POC=OFF \
            -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build tests
        run: cmake --build build/android-tests --parallel

      - name: ccache statistics
        run: ccache --show-stats

      - name: Run unit and null-GPU tests on emulator
        id: emulator_tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci/android_emulator_tests.sh

      # Runner infrastructure, not this repo, fails the first attempt; retry exactly once so a
      # real test failure still fails the job while an adb/emulator flake does not turn main red.
      - name: Retry emulator tests once (adb/emulator infrastructure flake)
        if: steps.emulator_tests.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci/android_emulator_tests.sh
