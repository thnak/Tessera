# SPDX-License-Identifier: MIT

# WebGPU backend lane (ADR-049 section 4 promotion conditions): build `tessera_webgpu` with
# Emscripten and the emdawnwebgpu port, load it under Node, and validate the authored WGSL.

name: WebGPU

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'decisions/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'decisions/**'
      - '**/*.md'

# A new push to a pull request cancels the run it supersedes; runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Read emsdk pin
        run: echo "EMSDK_VERSION=$(cat tools/emsdk-version.txt)" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # The cache holds the SDK and its port cache (the emdawnwebgpu package the port downloads,
      # verified by the SHA-512 pinned inside that emsdk release).
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" \
            https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"

      - name: Activate emsdk
        run: |
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"

      - name: Configure (wasm-webgpu)
        run: |
          emcc --version | head -n1
          cmake --preset wasm-webgpu

      - name: Build tessera_webgpu
        run: cmake --build --preset wasm-webgpu --parallel

      - name: Node load smoke
        run: >
          "$EMSDK_NODE" build/wasm-webgpu/src/rendering/backend/webgpu/webgpu_wasm_smoke.js

      # The web app path (issue #969, ADR-046): web_smoke is built by the preset above; this runs it
      # under Node (one frame request per wake, zero when parked) and checks the download budgets in
      # tools/web_budgets.json.
      - name: Web app smoke and budgets
        run: >
          "$EMSDK_NODE" scripts/ci/web_smoke.mjs build/wasm-webgpu/samples/web_smoke
          tools/web_budgets.json

  # P0 of the design-time preview (issue #164, docs/design/compiler-wasm.md): the compiler built to
  # Wasm must produce the same output as the native compiler. The Wasm build preset has
  # TESSERA_BUILD_TESTS=OFF, so this is a script invocation rather than a ctest case. The native
  # side builds one target (the CLI), not the whole native tree, so the job stays cheap next to
  # wasm-build; both sides come from the same commit.
  #
  # P1 (issue #165) adds the second half of the same idea: the diagnostics document the preview page
  # shows must be the one the native CLI produces (docs/specs/compiler-diagnostics-v1.md section 7).
  # It rides in this job because it is the same two builds of the same commit; the module it builds
  # is the browser artifact, not the Node tool, so the flags under test are the ones the page uses.
  wasm-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Read emsdk pin
        run: echo "EMSDK_VERSION=$(cat tools/emsdk-version.txt)" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      - name: Install emsdk
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" \
            https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"

      - name: Activate emsdk
        run: |
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$(dirname "$EMSDK_NODE")" >> "$GITHUB_PATH"

      # One configure for both sides: the Emscripten configure comes from the preset, the native
      # configure turns off everything the parity run does not need (tests, PoCs, Vulkan).
      - name: Configure (wasm-webgpu)
        run: |
          emcc --version | head -n1
          cmake --preset wasm-webgpu

      - name: Configure (native, compiler only)
        run: >
          cmake -S . -B build/native-parity -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTESSERA_BUILD_TESTS=OFF
          -DTESSERA_BUILD_POC=OFF
          -DTESSERA_BUILD_VULKAN=OFF
          -DTESSERA_WARNINGS_AS_ERRORS=ON

      # The frame CLI lives in the canvas-native-parity job, not here: that job installs lavapipe
      # and this one deliberately configures with -DTESSERA_BUILD_VULKAN=OFF (a parity run needs no
      # device). Configuring Vulkan here fails outright on a runner with no Vulkan SDK.
      - name: Build Wasm compiler
        run: cmake --build --preset wasm-compiler --parallel

      - name: Build native compiler
        run: cmake --build build/native-parity --target tessera_codegen_cli --parallel

      - name: IR parity (native vs Wasm)
        run: >-
          python3 -B scripts/ci/wasm_ir_parity.py
          --native build/native-parity/src/compiler/codegen/tessera_codegen
          --wasm build/wasm-webgpu/src/compiler/codegen/tessera_codegen.js
          --node "$EMSDK_NODE"
          --repeat 2

      # P1 of the preview (issue #165): the diagnostics document the page shows must be the one the
      # native compiler produces. The target is built by name rather than through a build preset so
      # the preset file (which P0 owns) is untouched; it is the same `wasm-webgpu` configure.
      - name: Build browser diagnostics module
        run: >-
          cmake --build build/wasm-webgpu
          --target tessera_diagnostics_wasm --parallel

      # The module is the in-memory driver behind a C export, and the in-memory-versus-CLI agreement
      # is already covered locally by `codegen_diagnostics_json`; this step proves the export wraps
      # it and that both sides produce byte-identical documents over the corpus.
      - name: Diagnostics parity (native vs Wasm)
        run: >-
          python3 -B scripts/ci/wasm_diagnostics_parity.py
          --native build/native-parity/src/compiler/codegen/tessera_codegen
          --wasm build/wasm-webgpu/src/compiler/codegen/tessera_diagnostics.js
          --node "$EMSDK_NODE"

      # P2 of the preview (issue #166): the evaluate -> scene -> layout -> snapshot path must produce
      # the same canonical UiSnapshot document in Wasm as the native harness's serializer does. This
      # is the slice's acceptance sentence, and it is the only place it is proven: the native half
      # runs on a developer box, the Wasm half cannot (it needs this emsdk). The native CLI is the
      # *preview* driver, not `tessera_codegen`, because P2 links the engine (Yoga, the text stack,
      # the stylesheet engine) and that must not enter the P0 Node tool.
      - name: Build native scene-preview CLI
        run: >-
          cmake --build build/native-parity
          --target tessera_scene_preview_cli --parallel

      - name: Build browser scene-preview module
        run: >-
          cmake --build build/wasm-webgpu
          --target tessera_scene_preview_wasm --parallel

      # The corpus declares a minimum node count per case, so "both sides empty" cannot pass; the
      # script resolves all three executables to absolute paths before it changes directory.
      - name: Scene snapshot parity (native vs Wasm)
        run: >-
          python3 -B scripts/ci/scene_snapshot_parity.py
          --native build/native-parity/src/compiler/codegen/tessera_scene_preview
          --wasm build/wasm-webgpu/src/compiler/codegen/tessera_scene_preview.js
          --node "$EMSDK_NODE"

      # P4 (issue #168): a scripted click sequence must produce the same state cells on both sides.
      # Same corpus shape and the same anti-vacuity principle, adapted to input: every case declares a
      # minimum state-cell count and a minimum number of handlers that must actually run, so a run
      # where every click missed cannot pass by agreeing on "nothing happened".
      - name: Scene input parity (native vs Wasm)
        run: >-
          python3 -B scripts/ci/scene_input_parity.py
          --native build/native-parity/src/compiler/codegen/tessera_scene_preview
          --wasm build/wasm-webgpu/src/compiler/codegen/tessera_scene_preview.js
          --node "$EMSDK_NODE"

      # P3 of the preview (issue #167): the canvas module. It links tessera_webgpu, so this is also
      # the check that the device half compiles and links under Emscripten with the frame driver.
      - name: Build browser canvas module
        run: >-
          cmake --build build/wasm-webgpu
          --target tessera_canvas_wasm --parallel

      # Node has no `navigator.gpu`, so this is the *unsupported-browser* contract and nothing more:
      # the module loads, reports `hasDevice:false`, and returns a report instead of crashing. The
      # pixel half of P3's acceptance cannot run here (see the canvas-native-parity job below).
      - name: Canvas module no-device contract (Node)
        run: >-
          python3 -B scripts/ci/scene_frame_parity.py --mode canvas-report
          --canvas build/wasm-webgpu/src/compiler/codegen/tessera_canvas.js
          --node "$EMSDK_NODE"

      # The page's font handover (issue #387), checked against the module the page actually downloads:
      # the two exports exist, the ABI is pointer-plus-size, and the refusal paths are answers rather
      # than crashes. Node has no device, so the module refuses the bytes for want of one - which is
      # the *piece of the contract a browser cannot check cheaply*, because a browser has a device and
      # would take the other branch. The glyphs themselves are proven natively (canvas-native-parity
      # and the `scene_frame` ctest paint text from these same bytes).
      - name: Canvas module font ABI (Node)
        run: >-
          python3 -B scripts/ci/scene_frame_parity.py --mode canvas-font
          --canvas build/wasm-webgpu/src/compiler/codegen/tessera_canvas.js
          --node "$EMSDK_NODE"

  # P3's pixel half, on the half of the gate that can actually render: the *native* reference.
  #
  # The acceptance sentence is "the canvas render is within tolerance of the lavapipe golden". Two
  # facts decide where that can be proven:
  #
  #   * the golden must come from lavapipe (ADR-009), which this job installs as the software Vulkan
  #     ICD; a hosted runner has no GPU, which is exactly why lavapipe is the reference;
  #   * the *candidate* is a WebGPU frame, and hosted runners have no GPU either, so a browser on
  #     this runner would fall back to SwiftShader or refuse. A WebGPU frame is therefore not a
  #     hosted-CI artifact at all.
  #
  # So this job proves the half that is real here - the lavapipe reference renders, deterministically,
  # with the corpus's minimum draw counts - and the browser lane supplies the candidate against these
  # goldens (docs/design/compiler-wasm.md section 8). It does NOT pretend to compare WebGPU pixels.
  canvas-native-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Three separate packages, and all three are needed:
      #   libvulkan-dev        the loader headers/library that find_package(Vulkan) requires
      #                        (Vulkan_INCLUDE_DIR + Vulkan_LIBRARY); without it the configure fails
      #                        before any test runs
      #   mesa-vulkan-drivers  the lavapipe ICD itself (the software renderer, ADR-009's reference)
      #   vulkan-tools         vulkaninfo, so a misconfigured lane is diagnosable from the log
      #   glslc                the shader compiler; the Vulkan backend raises a fatal error when it
      #                        is absent, and it is not part of libvulkan-dev
      - name: Install Ninja, the Vulkan loader and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev mesa-vulkan-drivers vulkan-tools glslc

      # Locate the lavapipe manifest instead of assuming its filename: the directory and the
      # `lvp_icd.<arch>.json` spelling vary by distribution and architecture, and guessing one is
      # what made this step fail while the install itself had succeeded.
      - name: Locate the lavapipe ICD
        run: |
          set -euo pipefail
          echo "ICD manifests present:"
          ls -1 /usr/share/vulkan/icd.d/ /etc/vulkan/icd.d/ 2>/dev/null || true
          manifest=""
          for candidate in /usr/share/vulkan/icd.d/lvp_icd*.json /etc/vulkan/icd.d/lvp_icd*.json; do
            if [ -f "$candidate" ]; then
              manifest="$candidate"
              break
            fi
          done
          if [ -z "$manifest" ]; then
            echo "::error::no lvp_icd*.json manifest found; mesa-vulkan-drivers did not install lavapipe"
            exit 1
          fi
          echo "lavapipe manifest: $manifest"
          echo "VK_ICD_FILENAMES=$manifest" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$manifest" vulkaninfo --summary | sed -n '1,25p'

      - name: Configure (native, frame CLI)
        run: >
          cmake -S . -B build/native-frame -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTESSERA_BUILD_TESTS=OFF
          -DTESSERA_BUILD_POC=OFF
          -DTESSERA_BUILD_VULKAN=ON
          -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build frame CLI and comparison tool
        run: >-
          cmake --build build/native-frame
          --target tessera_scene_frame_cli tessera_scene_frame_compare --parallel

      # VK_ICD_FILENAMES selects ONLY the lavapipe manifest, so a runner that did grow a GPU could
      # not silently turn this into a hardware render. The script refuses to write goldens from a
      # non-lavapipe device, so even a misconfigured lane cannot commit the wrong reference.
      - name: Preview canvas reference (lavapipe)
        # VK_ICD_FILENAMES is exported by the "Locate the lavapipe ICD" step above.
        run: |
          set -euo pipefail
          reference=build/canvas-reference
          python3 -B scripts/ci/scene_frame_parity.py \
            --native build/native-frame/src/compiler/codegen/tessera_scene_frame \
            --out-dir "$reference"
          # The goldens are committed from a lavapipe host and compared on every push. Until they
          # are committed this job proves the reference renders; it does not claim a comparison it
          # did not make.
          if [ -d tests/golden/canvas ]; then
            python3 -B scripts/ci/scene_frame_parity.py --mode compare \
              --native build/native-frame/src/compiler/codegen/tessera_scene_frame_compare \
              --golden-dir tests/golden/canvas \
              --candidate-dir "$reference"
          else
            echo "::notice::tests/golden/canvas is not committed yet; the lavapipe reference was rendered but not compared."
          fi

  wgsl-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Read naga pin
        run: echo "NAGA_VERSION=$(cat tools/naga-version.txt)" >> "$GITHUB_ENV"

      - name: Cache naga
        id: naga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/naga
          key: naga-${{ runner.os }}-${{ env.NAGA_VERSION }}

      - name: Install naga-cli
        if: steps.naga-cache.outputs.cache-hit != 'true'
        run: cargo install naga-cli --version "$NAGA_VERSION" --locked

      - name: Validate authored WGSL (naga)
        run: python3 -B scripts/ci/validate_wgsl.py --naga ~/.cargo/bin/naga
