# SPDX-License-Identifier: MIT

name: macOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ccache
        with:
          name: macos

      - name: Configure (AppleClang, null backend)
        run: >
          cmake -S . -B build/macos
          -DCMAKE_BUILD_TYPE=Release
          -DTESSERA_BUILD_VULKAN=OFF
          -DTESSERA_BUILD_POC=OFF
          -DTESSERA_PACKAGE_EXECUTABLES=merger_tests
          -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/macos --parallel

      - name: Package build (CPack TGZ)
        run: |
          cmake --build build/macos --target tessera-package-stage
          cpack --config build/macos/CPackConfig.cmake -G TGZ -B build/macos/package

      - name: Package gate (check_package.py)
        run: |
          python3 -B scripts/check_package.py \
            --archive "$(ls build/macos/package/tessera-*.tar.gz | head -n1)"

      - name: Install layout (cmake --install)
        run: |
          cmake --install build/macos --prefix build/macos/install-check --component licenses
          for name in LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt sbom.spdx.json; do
            test -f "build/macos/install-check/share/tessera/licenses/$name" || {
              echo "missing installed file: $name"; exit 1; }
          done

      - name: ccache statistics
        run: ccache --show-stats

      - name: Static-link allowlist (ADR-012, macOS)
        run: >
          python3 -B scripts/check_static_link.py --os macos
          --binary build/macos/tests/unit/merger_tests

      - name: Tests
        run: ctest --test-dir build/macos --output-on-failure

  release-gates:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Repository gates (aggregator)
        run: python3 -B scripts/gates.py
