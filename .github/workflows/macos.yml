# SPDX-License-Identifier: MIT

name: macOS

on:
  # Advisory lane (AGENTS.md, V1 platform scope and CI policy): nightly and on demand, not per push.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/ccache
        with:
          name: macos

      - name: Configure (AppleClang, null backend)
        run: >
          cmake -S . -B build/macos
          -DCMAKE_BUILD_TYPE=Release
          -DTESSERA_BUILD_VULKAN=OFF
          -DTESSERA_BUILD_POC=OFF
          -DTESSERA_PACKAGE_EXECUTABLES=merger_tests
          -DTESSERA_WARNINGS_AS_ERRORS=ON

      - name: Build
        # Cap the job count: the macOS runners hit their process limit with an unbounded
        # `--parallel`, failing compiles with "posix_spawn failed: Resource temporarily unavailable".
        run: cmake --build build/macos --parallel 4

      - name: Package build (CPack TGZ)
        env:
          SOURCE_DATE_EPOCH: "315532800"
          TZ: UTC
        run: |
          cmake --build build/macos --target tessera-package-stage
          cpack --config build/macos/CPackConfig.cmake -G TGZ -B build/macos/package

      - name: Package gate (check_package.py)
        run: |
          python3 -B scripts/check_package.py \
            --archive "$(ls build/macos/package/tessera-*.tar.gz | head -n1)"

      - name: Install layout (cmake --install)
        run: |
          cmake --install build/macos --prefix build/macos/install-check --component licenses
          for name in LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt sbom.spdx.json; do
            test -f "build/macos/install-check/share/tessera/licenses/$name" || {
              echo "missing installed file: $name"; exit 1; }
          done

      - name: ccache statistics
        run: ccache --show-stats

      - name: Static-link allowlist (ADR-012, macOS)
        run: >
          python3 -B scripts/check_static_link.py --os macos
          --binary build/macos/tests/unit/merger_tests

      - name: Tests
        run: ctest --test-dir build/macos --output-on-failure

  release-gates:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      # depth 2 keeps the parent commit, which the RHI-header docs gate diffs against on a
      # committed CI change (scripts/check_docs.py, ADR-049).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install pinned clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/format-venv"
          "$RUNNER_TEMP/format-venv/bin/pip" install "clang-format==$(cat tools/format-version.txt)"
          echo "CLANG_FORMAT=$RUNNER_TEMP/format-venv/bin/clang-format" >> "$GITHUB_ENV"

      - name: Repository gates (aggregator)
        run: python3 -B scripts/gates.py
