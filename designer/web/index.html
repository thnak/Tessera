<!--
  SPDX-License-Identifier: MIT

  Tessera Studio: the hosted studio page (issue #392 merged the three preview pages into one; issue
  #422 and ADR-054 converted its chrome to React 19 + TypeScript built by Vite).

  This document is a **mount point**: the chrome is React, rendered by `src/main.tsx` into `#root`.
  That is why there is no markup here beyond the mount node and the one module script -- and why the
  page checks render the chrome with `react-dom/server` instead of reading this file (ADR-054
  decision 6, `scripts/ci/preview_page_checks.mjs`).

  What the page is, in one paragraph, because it decides what may go in the bundle: one page with
  three views (Diagnostics compiles the source with `tessera_diagnostics`, Scene evaluates it with
  `tessera_scene_preview`, Canvas paints it through WebGPU with `tessera_canvas`), one shared editor,
  one toolbar (viewport, DPR, theme); samples open from the visitor's own clone of the repository. React renders the studio
  chrome only; the engine still draws exactly one thing, the preview canvas, and React never renders
  the previewed app (ADR-054 decision 3). The three Wasm modules stay three and stay lazy, and
  `preview-state.js` stays a pure ES module so the Node gates import the same source the page does.

  **Nothing leaves the browser.** No network call beyond this site's own static assets (the Vite
  bundle, the three Wasm modules, `build-id.txt`), no CDN, no
  telemetry. There is no share link: the studio has no cloud storage to share to.

  Vite injects the hashed `<script type="module">` and `<link rel="stylesheet">` at build time; both
  are same-origin files with a `src`/`href`, so the strict CSP ("no inline script, no remote script")
  holds (ADR-045, ADR-054 decision 4).
-->

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tessera Studio: diagnostics, scene and canvas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
