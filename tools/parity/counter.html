<!-- The browser twin of samples/parity-demo: the same structure and the very stylesheet the sample imports. No reset (ADR-063). Compare with scripts/ua_audit/page.mjs --root. The initial state is rendered: count 0. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tessera parity-demo twin</title>
<style>
  @font-face { font-family: T; src: url(../../tests/fixtures/fonts/NotoSans-Regular.ttf); }
  :root { --font-sans: T; }
  html, body { margin: 0; font-family: T; }
  button, input { font-family: T; line-height: 1.2; }
  /* the engine measures text with a stub (line height 1.2): pin the page to it so boxes compare */
  body { line-height: 1.2; }
</style>
<link rel="stylesheet" href="../../samples/parity-demo/counter.css">
</head>
<body>
<div class="counter">
  <div class="readout">Count: 0 idle</div>
  <button class="primary">Add</button>
  <button class="ghost">Reset</button>
</div>
</body>
</html>
