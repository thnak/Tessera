<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<!-- The browser twin of samples/motion: the same structure and the very stylesheet the sample imports. No reset: the browser's own defaults are what the engine's user-agent sheet reproduces (ADR-063). Compare with scripts/ua_audit/page.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tessera motion twin</title>
<style>
  @font-face { font-family: T; src: url(../../tests/fixtures/fonts/NotoSans-Regular.ttf); }
  :root { --font-sans: T; }
  html, body { margin: 0; font-family: T; }
  button, input { font-family: T; line-height: 1.2; }
  /* the engine measures text with a stub (line height 1.2): pin the page to it so boxes compare */
  body { line-height: 1.2; }
</style>
<link rel="stylesheet" href="../../samples/motion/motion.css">
</head>
<body>
<div class="stage">
  <h1>Motion</h1>
  <div class="pulse"></div>
  <button class="toggle">Expand</button>
  <div class="drawer"><p>This panel's height and colour transition when the class changes.</p></div>
</div>
</body>
</html>
