<html lang="en">
<head>
<meta charset="utf-8">
<title>Tessera grid twin</title>
<style>

  :root { --font-sans: T; }
  html, body { margin: 0; font-family: T; }
  button, input { font-family: T; line-height: 1.2; }
</style>
<link rel="stylesheet" href="../../samples/grid/grid.css">
</head>
<body>
<div class="page">
  <header class="top"><h1>Grid and container queries</h1></header>

    <div class="cards">
      <section class="card"><h3>Frames</h3><p>Fixed-step loop, render on demand.</p></section>

      <section class="card"><h3>Style</h3><p>Cascade, layers, media and container queries.</p></section>

    </div>
  </main>
</div>

</html>
