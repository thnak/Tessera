# Gradle properties for the Android app shell (issue #189).
#
# The engine's CMake project builds the whole tree, which is far more than an APK needs. Gradle runs
# it in its own build directory under android/app/.cxx, so it never collides with a desktop lane's
# build/ tree.

# The AndroidX/Jetifier machinery is unused: the app has no Java or Kotlin source.
android.useAndroidX=true
android.nonTransitiveRClass=true

# The engine's CMake configure is slow (it probes the whole third_party tree), so keep the daemon
# and the configuration cache warm between builds.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
